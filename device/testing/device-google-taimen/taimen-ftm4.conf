options ftm4 keep_powered=1
# Leave the touchscreen controller powered across suspend, as downstream's
# lowpower_mode path does. Measured on this device, interleaved, 3 rounds each:
# ftm4_resume 201.8 -> 85.6 ms, a saving of 116 ms (58%). The driver default is
# off because the idle cost of a powered controller is not yet measured; this
# device opts in because its resume budget is the user-visible wake.
