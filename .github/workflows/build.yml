# Build this branch's forked packages natively on aarch64 and publish them as
# a signed apk repository that pmbootstrap and apk read directly.
#
# Builds run in a privileged Alpine container through
# .github/scripts/run-pmbootstrap.sh, the way pmaports' own CI runs
# pmbootstrap. Publishing (.github/scripts/publish.sh) needs the PACKAGES_TOKEN
# and PACKAGES_SIGNING_KEY secrets of the "publish" environment and fails
# without them. While the packages repository is private, the optional
# PACKAGES_READ_TOKEN repository secret lets "Select packages" see what is
# already published. Design: ARCHITECTURE.md in the packages repository.
name: Build

on:
  push:
    branches: [taimen-bringup]
  pull_request:
    branches: [taimen-bringup]
  workflow_dispatch:
    inputs:
      packages:
        description: Build only these aports (space separated)
        type: string
        default: ""
      heavy:
        description: Allow heavy-tier aports (multi-hour builds)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.ref_name != 'taimen-bringup' }}

env:
  # The one place that names the organization and the published repository.
  PACKAGES_REPO: porthole-dev/pmos-packages
  SIGNING_KEY_NAME: porthole-dev-packages-20260915.rsa
  PACKAGER: Giuseppe Maggio <jertlok@proton.me>
  ALPINE: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-24.04
    container: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - run: apk -q add git github-cli jq python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes and manual runs also build the forked aports that are not
          # published yet, measured from the merge base with upstream
          # pmaports: that needs the whole history, commits and trees only.
          fetch-depth: ${{ github.event_name == 'pull_request' && 100 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Download the published index
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -u
          branch=$(python3 -c 'import configparser as c; p = c.ConfigParser(); p.read("pmaports.cfg"); ch = c.ConfigParser(); ch.read("channels.cfg"); print(ch[p["pmaports"]["channel"]]["branch_pmaports"])')
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          fetch() { # directory tag
            mkdir -p "/index/$1"
            if [ -n "$GH_TOKEN" ]; then
              out=$(gh release download "$2" -R "$PACKAGES_REPO" -p APKINDEX.tar.gz -D "/index/$1" 2>&1) && return
              case "$out" in
              *"release not found"*) touch "/index/$1/NO_RELEASE" ;;
              # A token that cannot read the index would silently rebuild or
              # skip packages: fail instead.
              *) echo "::error::Cannot download the $2 index: $out"; exit 1 ;;
              esac
            else
              wget -q -O "/index/$1/APKINDEX.tar.gz" "https://github.com/$PACKAGES_REPO/releases/download/$2/APKINDEX.tar.gz" ||
                rm -f "/index/$1/APKINDEX.tar.gz"
            fi
          }
          fetch pmaports "$branch/aarch64"
          fetch systemd "systemd/$branch/aarch64"
          find /index -type f
      - id: select
        env:
          PACKAGES: ${{ inputs.packages }}
          HEAVY: ${{ inputs.heavy }}
          FORKS: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global --add safe.directory "$PWD"
          CI_MERGE_REQUEST_DIFF_BASE_SHA=$(sh .github/scripts/base-commit.sh)
          export CI_MERGE_REQUEST_DIFF_BASE_SHA
          INDEX_DIR=/index sh .github/scripts/run-pmbootstrap.sh --no-init 'python3 .github/scripts/packages.py select'
          echo "packages=$(cat /work/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    # GitHub appends the package, "Build (mesa)"; a skipped job shows "Build".
    name: Build
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/work/cache_apk_aarch64
          key: pmbootstrap-apk-aarch64-${{ github.run_id }}
          restore-keys: pmbootstrap-apk-aarch64-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/work/cache_ccache_aarch64
            ${{ runner.temp }}/work/cache_distfiles
          key: pmbootstrap-build-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: pmbootstrap-build-${{ matrix.package }}-
      - name: Build the package
        env:
          PKG: ${{ matrix.package }}
        run: |
          df -h /
          docker run --rm --privileged \
            -v "$PWD:/pmaports" -w /pmaports -v "$RUNNER_TEMP/work:/work" \
            -e HOST_UID="$(id -u)" -e PACKAGER -e PKG \
            -e PACKAGES_URL="https://github.com/$PACKAGES_REPO/releases/download" \
            "$ALPINE" sh .github/scripts/run-pmbootstrap.sh 'python3 .github/scripts/packages.py build "$PKG"'
          df -h /
      - name: Check packages for build machine details
        run: |
          set -eu
          fail=0
          for apk in "$RUNNER_TEMP"/work/packages/*/aarch64/*.apk; do
            dir=$(mktemp -d)
            tar -xzf "$apk" -C "$dir" 2>/dev/null
            echo "${apk##*/packages/}"
            grep -E '^(pkgname|pkgver|packager|maintainer|origin|commit) ' "$dir/.PKGINFO" | sed 's/^/  /'
            for needle in "$(hostname)" /home/runner "$GITHUB_WORKSPACE"; do
              if grep -rlaF -- "$needle" "$dir" >/dev/null; then
                echo "::error::${apk##*/} contains a build machine path or hostname"
                fail=1
              fi
            done
            rm -rf "$dir"
          done
          exit "$fail"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.package }}
          # Keeps the <local repository>/aarch64/ layout that publish maps to releases.
          path: |
            ${{ runner.temp }}/work/packages/
            !${{ runner.temp }}/work/packages/**/APKINDEX.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish repository
    needs: [select, build]
    # A push to taimen-bringup, or a manual run on it (to fill the repository),
    # in this organization. Also when nothing was built: every run keeps the
    # indexes (x86_64 included) and the packages.conf exclusions in shape.
    if: >-
      !cancelled() && github.repository_owner == 'porthole-dev'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == 'taimen-bringup'
      && needs.select.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Holds the signing key and write token; restrict it to taimen-bringup.
    environment: publish
    permissions:
      contents: read
      # actions/attest: sign (OIDC) and store the provenance of what is uploaded.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check for publishing secrets
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KEY" ]; then
            echo "::error::PACKAGES_TOKEN or PACKAGES_SIGNING_KEY is not set in the publish environment: nothing can be published"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - id: publish
        name: Sign, upload and verify the repositories
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          BRANCH: ${{ needs.select.outputs.branch }}
        run: |
          UNPUBLISHED=$(awk '$1 == "unpublished" { printf "%s ", $2 }' .github/packages.conf)
          export UNPUBLISHED
          mkdir -p "$RUNNER_TEMP/packages"
          sh .github/scripts/publish.sh "$RUNNER_TEMP/packages"
          if [ -s "$RUNNER_TEMP/uploaded.sha256" ]; then echo "uploaded=true" >> "$GITHUB_OUTPUT"; fi
      - name: Attest the uploaded files
        if: steps.publish.outputs.uploaded && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/uploaded.sha256
      - name: Say why nothing is attested
        if: steps.publish.outputs.uploaded && github.event.repository.visibility != 'public'
        run: echo "::notice::Uploaded files are not attested while this repository is private (artifact attestations need a public repository on this plan)"
