# Checks for pushes and pull requests: commit trailers, APKBUILD lint, and
# that the sources and patches of every changed aport still apply.
name: CI

on:
  push:
    branches: [taimen-bringup]
  pull_request:
    branches: [taimen-bringup]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ALPINE: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

jobs:
  commit-check:
    name: Check commit trailers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Credentials stay: the partial clone fetches missing objects on demand.
      - name: Test the check
        run: sh .github/scripts/test-commit-check.sh
      - name: Check trailers and DCO sign-off
        run: |
          base=$(sh .github/scripts/base-commit.sh)
          if [ -z "$base" ]; then echo "no new commits"; exit 0; fi
          sh .github/scripts/commit-check.sh "$base" HEAD \
            ${{ github.event_name == 'pull_request' && '--dco' || '' }}

  lint:
    name: Lint APKBUILDs
    runs-on: ubuntu-24.04
    container: docker.io/library/alpine:edge@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000
    steps:
      - run: apk -q add atools git jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Run apkbuild-lint and check version bumps
        run: |
          git config --global --add safe.directory "$PWD"
          CI_MERGE_REQUEST_DIFF_BASE_SHA=$(sh .github/scripts/base-commit.sh)
          export CI_MERGE_REQUEST_DIFF_BASE_SHA
          sh .github/scripts/run-pmbootstrap.sh --no-init 'python3 .github/scripts/packages.py lint'

  patch-check:
    name: Check sources and patches
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/work/cache_apk_aarch64
          key: pmbootstrap-apk-aarch64-${{ github.run_id }}
          restore-keys: pmbootstrap-apk-aarch64-
      - name: Fetch, verify, unpack and patch changed aports
        run: |
          CI_MERGE_REQUEST_DIFF_BASE_SHA=$(sh .github/scripts/base-commit.sh)
          export CI_MERGE_REQUEST_DIFF_BASE_SHA
          docker run --rm --privileged \
            -v "$PWD:/pmaports" -w /pmaports -v "$RUNNER_TEMP/work:/work" \
            -e HOST_UID="$(id -u)" -e CI_MERGE_REQUEST_DIFF_BASE_SHA -e GITHUB_REPOSITORY_OWNER \
            "$ALPINE" sh .github/scripts/run-pmbootstrap.sh 'python3 .github/scripts/packages.py check-patches'
