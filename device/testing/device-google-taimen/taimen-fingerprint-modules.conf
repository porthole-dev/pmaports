# The QSEE listener transport has no device to bind to -- it is a plain misc
# device, not a driver matched from the devicetree the way fpc1020 is -- so
# nothing loads it on its own. Without it there is no /dev/qsee_lsnr, the
# supplicant's ConditionPathExists keeps it from starting, Gatekeeper cannot
# reach RPMB, and enrolling a finger fails with the trustlet refusing to
# commit. Only shipped by the -fingerprint subpackage, so it loads on the
# devices that opted in.
qsee_lsnr
