  - Awb:
      # Bayesian AWB searches along the colour temperature locus below (and
      # at most transversePos/Neg off it), which is what projecting the grey
      # world estimate onto the curve used to do by hand. Priors are flat:
      # no lux estimate exists in the software ISP.
      algorithm: bayes
      priors:
        - lux: 0
          ct: [ 2000, 13000 ]
          probability: [ 1.0, 1.0 ]
      transversePos: 0.01
      transverseNeg: 0.01
      AwbMode:
        AwbAuto:
          lo: 2500
          hi: 8000
        AwbIncandescent:
          lo: 2500
          hi: 3000
        AwbTungsten:
          lo: 3000
          hi: 3500
        AwbFluorescent:
          lo: 4000
          hi: 4700
        AwbIndoor:
          lo: 3000
          hi: 5000
        AwbDaylight:
          lo: 5500
          hi: 6500
        AwbCloudy:
          lo: 7000
          hi: 8000
      # Colour-temperature locus, extracted from the vendor chromatix
      # (libchromatix_imx362_pixel_res0_snapshot_3a.so, .data 0x30..0xb0: 16
      # (R/G, B/G) reference points, of which 10 are distinct). The gains are
      # the reciprocals of those raw ratios; each 'ct' key is what libipa's
      # estimateCCT() returns for that same reference point, so a genuinely
      # grey scene maps back onto itself and the curve acts purely as a
      # projection. Reference points closer together than the 100 K CCM
      # threshold are merged -- estimateCCT() cannot separate them and
      # interpolating between them would sawtooth.
      #
      # Cross-check: an independently measured white reference under a ~3400 K
      # lamp gave raw R/G 0.746, B/G 0.367 (neutralising gains R 1.340,
      # B 2.724); this curve at that point's own temperature (3419 K) gives
      # R 1.337, B 2.693 -- 0.2% and 1.1% off.
      colourGains:
        - ct: 2574
          gains: [ 0.9102, 3.6590 ]
        - ct: 2778
          gains: [ 1.0476, 3.9428 ]
        - ct: 3117
          gains: [ 1.1545, 2.8958 ]
        - ct: 3937
          gains: [ 1.6507, 2.3443 ]
        - ct: 4785
          gains: [ 1.8119, 1.7665 ]
        - ct: 5091
          gains: [ 1.8797, 1.6617 ]
        - ct: 6151
          gains: [ 2.1119, 1.4334 ]
        - ct: 7390
          gains: [ 2.2843, 1.2789 ]
  - Ccm:
      ccms:
        - ct: 2300
          ccm: [ 1.4925, -0.3314, -0.1612,
                -0.1679,  1.0461,  0.1218,
                -0.0178, -0.9580,  1.9758 ]
        - ct: 2850
          ccm: [ 1.2599, -0.2695,  0.0096,
                -0.1156,  1.0444,  0.0712,
                 0.2392, -1.0526,  1.8134 ]
        - ct: 4000
          ccm: [ 1.6559, -0.5974, -0.0585,
                -0.1350,  1.1831, -0.0481,
                 0.0284, -0.6398,  1.6114 ]
        - ct: 6500
          ccm: [ 1.4521, -0.4407, -0.0114,
                -0.1014,  1.1466, -0.0452,
                 0.0516, -0.5695,  1.5179 ]
  - Adjust:
  - Agc:
      AeConstraintMode:
        ConstraintNormal:
          # The default: the brightest 2% of the scene at least mid grey.
          lower:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.5
          # Highlight protection, as the vendor AE does: back off once the
          # brightest 2% saturate, instead of exposing for the mean alone.
          upper:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.98
        ConstraintHighlight:
          lower:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.5
          upper:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.8
      # Exposure time (us) and analogue gain stages. Normal fills a 1/15 s
      # frame before the gain passes 4x; Short keeps motion sharp; Long
      # trades frame rate for noise.
      AeExposureMode:
        ExposureNormal:
          exposureTime: [ 100, 10000, 33000, 66000 ]
          gain: [ 1.0, 2.0, 4.0, 8.0 ]
        ExposureShort:
          exposureTime: [ 100, 5000, 10000, 20000 ]
          gain: [ 1.0, 2.0, 4.0, 8.0 ]
        ExposureLong:
          exposureTime: [ 1000, 33000, 66000, 125000 ]
          gain: [ 1.0, 1.0, 2.0, 8.0 ]
  - Af:
      # Lens position in dioptres to lc898214xd focus_absolute code.
      #
      # REPLACED 2026-09-16 together with the driver's control range. The old
      # map ([0.0, 581, 7.0, 0]) was fitted while FOCUS_ABSOLUTE still spanned
      # hall +324..-257 -- a narrow slice on the FAR side of the travel, in
      # which nothing close could be focused at all. The driver now exposes
      # 0..1369 onto hall -257..+1112, low = far, high = near, so these codes
      # mean nothing against an older kernel.
      #
      # focus_absolute = hall + 257. Anchors:
      #
      #   0.0 dioptres -> hall  268 -> code  525   this module's OTP infinity
      #   4.5 dioptres -> hall ~530 -> code  787   MEASURED: a 0.222 m subject
      #                                            (laser, +/-3%) peaked here,
      #                                            13x over the worst position
      #
      # That slope is ~58 codes per dioptre. The third point extends it to the
      # 0.1 m the vendor's LensInfo claims as MinFocusDistance; it is
      # EXTRAPOLATED, not measured, and wants a station near 0.1 m to confirm.
      # Stations between 0.5 and 2 m are owed too: the sweeps taken there
      # measured the old, clipped range and do not transfer.
      map: [ 0.0, 525, 4.5, 787, 10.0, 1107 ]
      default: 0.5
