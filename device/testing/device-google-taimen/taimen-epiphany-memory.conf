# Bound the browser's cgroup, so one app cannot reset the GPU for everyone.
#
# THE FAILURE THIS FIXES (measured 2026-08-30, kernel 7.2.2)
#   Epiphany on YouTube grows without limit until the GPU cannot keep up:
#
#     01:44:48.080 kernel [drm:a5xx_irq] *ERROR* gpu fault ring 0 fence b0f0
#                         status EE0011C1 ib1 ...31814000/0000 ib2 .../0000
#     01:44:48.089 kernel [drm:recover_worker] *ERROR* hangcheck recover!
#     01:44:48.091 kernel offending task: WebKitWebProces
#     01:44:48.549 phoc   [render/gles2/pass.c:315] GPU reset (innocent)
#     01:44:48.549 phoc   Re-creating renderer after GPU reset
#
#   Note IB1/IB2 BUFSZ=0000 and the absence of any SMMU fault line: the GPU was
#   not chasing a bad pointer, it was busy and not retiring. It choked on the
#   working set. 458 ms later the compositor -- explicitly ruled "innocent" by
#   GL_KHR_robustness, because the guilty context was WebKit's -- had to rebuild
#   its whole EGL renderer and re-upload every texture in the session. THAT is
#   why the corruption appears in phosh's top panel and in other apps' icons and
#   not merely inside the browser window: an a5xx recovery resets the GPU for
#   every client on the device.
#
#   State at the time, with no bound in place: scope 2097 MiB of a 3754 MiB
#   phone, 1.84 GiB of it shmem-backed GEM, one WebKitWebProcess alone holding
#   1292 MiB of drm-resident-memory, MemAvailable down to 318 MiB and 527 MiB of
#   the browser already compressed into zram while merely idle.
#
# WHY MemoryHigh= AND NOT MemoryMax=
#   High throttles and reclaims; Max kills. A browser that dies on a memory
#   spike is a worse phone than a browser that slows down, and the whole point
#   here is to keep the SESSION alive, not to punish the app.
#
# WHY THIS WORKS AT ALL -- it is not just a kernel bound, it ARMS WebKit
#   libwebkitgtk-6.0.so.4 contains "/sys/fs/cgroup/%s/%s/%s", "memory.current",
#   "memory.high" and "memory.max": WebKit sizes its own MemoryPressureHandler
#   from its cgroup's limit. With memory.high unset the limit reads "max", so
#   WebKit believes it is nowhere near a wall and never sheds a single tile --
#   it just grows until the GPU stalls. Setting this is what gives WebKit a
#   ceiling to react against, so it discards tiles and caches BEFORE the kernel
#   has to swap GPU buffers out to zram. That is the difference between the
#   browser shedding cheaply and the whole session stalling in direct reclaim.
#
# WHY THE SCOPE AND NOT app.slice
#   WebKit reads its OWN cgroup, parsed from /proc/self/cgroup; it does not walk
#   up to parents. A limit on the parent slice would still bound the memory, but
#   WebKit would keep reading "max" from its own scope and would never shed --
#   so the bound would be enforced purely by swapping, which is the expensive
#   half of what we are trying to stop. The limit has to be here to do its job.
#
#   For the same reason this is deliberately NOT app-.scope.d/ (which systemd
#   would apply to every app scope): an app that does not read cgroup limits
#   gains nothing from a bound except being swap-throttled. Bounding the ones
#   that cooperate is what buys something. If a second browser ever needs it,
#   give it its own drop-in rather than widening this one.
#
# THE NUMBER
#   1500M of 3754M total. The session outside the browser measures ~1.35 GiB,
#   so this leaves roughly 900 MiB genuinely free instead of the 318 MiB seen
#   at the failure. It is a calibration knob, not a law: raise it if the browser
#   feels throttled with psi_full still at zero, lower it if the session is
#   still stalling. Measure with tools/tk-mempressure.sh, which prints
#   psi_full, scope, gem and high side by side for exactly this decision.
#
# NO OPENRC COUNTERPART EXISTS, deliberately: per-app scopes are created by
# systemd --user, and under OpenRC there is no scope to attach a limit to. This
# is not a missing parity fix, it is a mechanism that only exists under systemd.
[Scope]
MemoryHigh=1500M
