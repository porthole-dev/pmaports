# Overrides for this branch's CI (.github/workflows/build.yml and
# upstream-check.yml). Which aports CI builds is NOT listed here: it is
# derived from git (.github/scripts/packages.py):
#
#   pull requests         the aports the pull request changes
#   pushes, manual runs   the same, plus every forked aport (added or changed
#                         since the merge base with upstream pmaports) whose
#                         exact pkgver-pkgrel is not in the published repository
#
# This file only overrides that selection:
#
#   heavy    multi-hour builds: only on a manual run with heavy=true, never by
#            default
#   exclude  forked, but never built, checked or published by CI (a manual
#            run that names it still builds it)
#   unpublished
#            built and checked when a change touches it, never published.
#            For host tools that run in pmbootstrap's native chroot: an
#            aarch64 build is of no use to an x86_64 host, which reads the
#            (empty) x86_64 index and builds its own.
#
# firmware-* is never built or published, whatever this file says: vendor
# blobs are not ours to redistribute. That rule lives in scripts/packages.py
# and scripts/publish-repo.sh, not here, so it cannot be edited away.

heavy webkit2gtk-6.0
heavy epiphany
heavy chromium

unpublished crossdirect
