# Make a LONG power-press do something when the shell is dead.
#
# postmarketos-base-systemd ships /usr/lib/systemd/logind.conf with
# HandlePowerKey=ignore, which is correct: on a phone the SHELL owns the short
# press (screen off / lock). But it leaves the device with no power-button
# behaviour at all when the shell is not running or has hung -- and on this
# device a wedged session is a documented, recurring state, not a hypothetical.
#
# So: leave the short press alone (the shell keeps it), and give the LONG press
# to logind. A drop-in in logind.conf.d/ overrides the main logind.conf.
#
# HONEST LIMIT, so nobody over-trusts this: logind is a userspace daemon that
# talks to PID 1. If PID 1 itself is frozen (the SIGSEGV freeze this device
# suffers -- see taimen-crash-reboot.conf), this will NOT save you either, and
# the answer is still a ~10 s hardware long-press. This helps the much more
# common case where the SHELL died but init is healthy.
[Login]
HandlePowerKeyLongPress=poweroff
