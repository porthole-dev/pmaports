# tuned does not need the network, and waiting for it costs this device most of
# two seconds of boot on the critical path.
#
# Measured 2026-08-20 with systemd-analyze critical-chain:
#
#   graphical.target @12.084s
#   └─tuned-ppd.service @10.946s +1.136s
#     └─tuned.service @9.863s +1.043s
#       └─network.target @9.829s
#         └─NetworkManager.service @9.704s
#           └─taimen-modem-bringup.service @8.299s +1.389s
#
# tuned-ppd is pulled in by postmarketos-base-ui-gnome (GNOME Settings uses its
# power-profiles D-Bus API), so it is not ours to remove -- but tuned.service is
# the ONLY unit on this device ordered both After=network.target and before
# graphical.target, which is what drags the modem bring-up onto the path to the
# user session. Dropping just that ordering lets the session start while the
# modem is still coming up, and changes nothing about what tuned does.
#
# After= with an empty value resets the list, so the two entries tuned actually
# wants are restated. basic.target is tuned's own; the rest come from
# DefaultDependencies=yes and are unaffected by this reset.
[Unit]
After=
After=basic.target
