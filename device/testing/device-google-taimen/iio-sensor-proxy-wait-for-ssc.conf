# Every sensor on this device sits behind the SLPI island and appears only
# after the remoteproc and sns-reg are up -- about 13 s into boot -- and they
# register one at a time, prox/ALS last.
#
# iio-sensor-proxy is Type=dbus with no ordering, so whichever client activates
# it first can catch it before the prox/ALS device exists. It then runs for the
# whole session with HasAmbientLight=false and no proximity, which looks
# exactly like a missing sensor. Measured: on a cold boot only the
# accelerometer was found, and a plain `systemctl restart` picked up all three.
[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 50); do grep -qs prox-light /sys/bus/iio/devices/iio:device*/name && exit 0; sleep 0.2; done; exit 0"
