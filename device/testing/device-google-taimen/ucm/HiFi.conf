# Use case configuration for the Google Pixel 2 XL (taimen).
#
# This board does NOT look like the other WCD934x devices, so the
# /codecs/wcd934x include set that DB845c uses does not apply here:
#
#   - There is no codec-analog output path at all. The vendor overlay replaces
#     qcom,audio-routing wholesale with no LINEOUT or HPH entries, so playback
#     does not go out over SLIMBUS_0_RX. It goes out over QUATERNARY MI2S to a
#     pair of TAS2557 amplifiers, which expose no ALSA volume of their own --
#     hence no PlaybackVolume below, and software volume above it.
#   - Capture is on the DMIC path at slot SEVEN -- TX7 / DEC7 / MUX7 -- not the
#     TX0/DEC0 the shared include assumes. Following the stale Qualcomm
#     reference path (handset-mic -> dmic2 -> DMIC1 on TX0) points at a
#     microphone that is not fitted.
#
# Both routes are the ones verified acoustically end to end; see
# taimen/docs/HANDOFF-audio.md sections 11 and 12.

SectionVerb {

	EnableSequence [
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	# The Comment becomes the label a user sees in Settings, so keep it
	# short; the routing detail lives in the header above.
	Comment "Loudspeakers"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone"

	# MultiMedia2, NOT MultiMedia1. Capture has to sit on a different
	# front-end from playback: routing MultiMedia1 to SLIMBUS_0_TX tears the
	# QUAT_MI2S_RX playback route back down -- measured, the speaker mixer
	# flips to 0 the moment the capture mixer on the same FE is set. It is
	# also the front-end capture was verified on (arecord -D hw:0,1).
	EnableSequence [
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' DMIC"
		cset "name='DMIC MUX7' DMIC1"
		cset "name='IIR0 INP0 MUX' DEC7"
	]

	DisableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureVolume "DEC7 Volume"
	}
}
