# Package tiers for this branch's CI (.github/workflows/build.yml and
# upstream-check.yml).
#
#   required  built whenever its exact version is missing from the published
#             repository, even when a push did not touch it
#   heavy     multi-hour builds: only on a manual run with heavy=true (or on a
#             self-hosted runner), never by default
#
# Aports that are not listed are still built when a push changes them.
# Every listed aport is also checked by the scheduled upstream check: sources
# and patches, and whether an upstream package outranks it.
#
# firmware-* is never built or published, whatever this file says: vendor
# blobs are not ours to redistribute. That rule lives in scripts/packages.py
# and scripts/publish-repo.sh, not here, so it cannot be edited away.
#
# Mirrors porthole's profiles/<device>/aports.conf; `optional` there is
# `heavy` here when the reason is build time.

required device-google-taimen
required linux-postmarketos-qcom-msm8998-7.2
required mesa
required phoc
required phosh
required gst-plugins-good
required libcamera
required xdg-desktop-portal
required libfprint
required fprintd
required gnome-control-center
required tap
required obscura

heavy webkit2gtk-6.0
heavy epiphany
heavy chromium
