# Refuse to suspend until the IPA hang is fixed.
#
# The kernel gained CONFIG_SUSPEND on 2026-07-31. Entering suspend with the
# `ipa` driver loaded hard-hangs the SoC -- bisected to ipa alone, see
# docs/HANDOFF-daily-driver.md. The hardware watchdog USUALLY resets the phone
# ~30 s later, but on 2026-08-02 it did not and the device needed a hands-on
# power cycle (PLAN-daily-driver-v2.md 6.5a).
#
# That matters because something already asks for it: GNOME's power plugin
# ships sleep-inactive-battery-type='suspend' with a 900 s timeout, and phosh's
# power menu has a Suspend entry. Before CONFIG_SUSPEND those calls were
# no-ops. Now they would reset an idle, unplugged phone every 15 minutes, and
# it would present as "the phone randomly reboots itself" with nothing in the
# log, because a watchdog reset does not survive into pstore.
#
# THIS MUST BE INSTALLED ON systemd-suspend.service, NOT ON suspend.target.
# From 2026-07-31 to 2026-08-02 it was on suspend.target and was DECORATIVE --
# it never blocked anything, and the docs claimed protection the device did not
# have. The reason is in the stock unit:
#
#     suspend.target:  Requires=systemd-suspend.service
#                      After=systemd-suspend.service
#
# The After= means systemd-suspend.service RUNS FIRST and does the actual
# suspend; suspend.target's own assertions are not evaluated until its job
# runs, which is after the machine has already gone down. Asserting on the
# target guards a gate that is only reached once you are already through it.
# systemd-suspend.service is the unit that performs the work, so that is where
# the assertion has to live. Verified on-device by the ExecStart=/bin/true
# method described in tools/tk-suspend-guard-check.sh -- never by attempting a
# real suspend, which is how the 2026-08-02 incident happened.
#
# An Assert rather than a Condition on purpose: a failed assertion makes the
# suspend attempt FAIL loudly instead of silently succeeding-by-skipping, so
# whoever tries it gets told why.
#
# To arm a deliberate suspend test:  touch /run/taimen-suspend-is-safe
# It is on tmpfs, so every reboot re-arms the guard by itself. That is the
# point -- a leftover arming file must never be able to survive into a boot
# nobody is watching.
[Unit]
AssertPathExists=/run/taimen-suspend-is-safe
