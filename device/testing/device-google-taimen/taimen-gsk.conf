# GTK4 rendering on an Adreno 540.
#
# GSK_RENDERER=gl: the default ngl/vulkan renderer path is not what this device
# wants; GL is, and GL works well here (GL_RENDERER: FD540, OpenGL ES 3.1).
GSK_RENDERER=gl

# VK_LOADER_DRIVERS_DISABLE: Turnip covers a6xx and newer. The A540 is a5xx and
# never will be supported -- it rejects the device outright:
#
#   TU: error: tu_device.cc:1667: device Turnip Adreno (TM) 540 is unsupported
#              (VK_ERROR_INITIALIZATION_FAILED)
#   Vulkan: Loader Message: setup_loader_term_phys_devs:
#           Failed to detect any valid GPUs in the current config
#
# Measured 2026-08-20: GSK_RENDERER=gl was already set in the session and that
# message still appeared, because the loader enumerates every installed ICD
# regardless of which GTK renderer is chosen. mesa-vulkan-freedreno is pulled in
# by soc-qcom-vulkan, so the package cannot simply be dropped for this device.
# Tell the loader to skip the driver instead, so no GTK4 app pays to load an ICD
# that is guaranteed to fail.
VK_LOADER_DRIVERS_DISABLE=*freedreno*
