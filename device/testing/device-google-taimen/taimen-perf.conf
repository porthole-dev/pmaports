# Tighten schedutil's reaction time (default 10 ms) so CPU frequency follows
# UI bursts within a frame. Globbed over policy* rather than naming policy0 and
# policy4: one line covers both clusters and it does not have to be revisited if
# the policy numbering changes. The schedutil/ directory only exists while that
# governor is selected, so this silently does nothing under any other governor
# -- that is intentional, the value is meaningless elsewhere.
w /sys/devices/system/cpu/cpufreq/policy*/schedutil/rate_limit_us - - - - 2000
# Keep the GPU out of runtime suspend across short interaction pauses; msm's
# default autosuspend means every touch after a reading pause pays the
# resume + requan cost before the first frame.
#
# The path is globbed because the DT soc node was renamed between the kernels
# this device has run: 6.0 had `soc: soc {` -> /sys/devices/platform/soc/, 6.18
# has `soc: soc@0 {` -> /sys/devices/platform/soc@0/. This line was written for
# 6.0 and named /sys/devices/platform/soc/ literally, so it has applied to
# NOTHING since the move to 6.18 -- tmpfiles just skips a `w` whose path does
# not exist, with no error anywhere. tmpfiles.d(5) documents shell globs for
# `w`, so soc* covers both spellings and any future rename.
w /sys/devices/platform/soc*/5000000.gpu/power/autosuspend_delay_ms - - - - 1000
