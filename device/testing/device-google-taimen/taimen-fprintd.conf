# fprintd drives taimen's fingerprint sensor through libfprint's fpctee
# driver, which reaches the TrustZone trustlet through /dev/fpc_tee.
[Service]
# The sensor has no bus libfprint can enumerate -- its SPI device belongs to
# TrustZone -- so the driver is instantiated from this variable, naming the
# node.
Environment=FPCTEE_DEVICE=/dev/fpc_tee

# The stock unit filters device access to USB, SPI and hidraw nodes.
DeviceAllow=/dev/fpc_tee rw

# The trustlet stores its encrypted template database in files it reads and
# writes itself, through file requests the driver serves inside fprintd. They
# get a directory of their own, created by tmpfiles.d: fprintd treats every
# entry of its own state directory as a username. Not a second StateDirectory=
# -- systemd sorts those, and fprintd stores its prints in whichever comes
# first, which put them in /var/lib/fpctee.
ReadWritePaths=-/var/lib/fpctee
