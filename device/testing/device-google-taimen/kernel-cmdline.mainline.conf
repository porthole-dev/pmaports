clk_ignore_unused
ignore_loglevel
panic=10
earlycon=msm_serial_dm,0xc1b0000
qcom_wdt.arm_on_probe=1
watchdog.open_timeout=300

# Keep the IPA (mobile-data offload) driver from loading at all. This is what
# the other three msm8998 devices in pmaports do -- device-oneplus-cheeseburger,
# device-oneplus-dumpling and device-xiaomi-sagit all carry the same
# modprobe.blacklist=ipa line in their own kernel-cmdline conf.
#
# Entering system suspend with `ipa` loaded hard-hangs the SoC: matched A/B,
# ipa unloaded + cpuidle hook = clean s2idle cycle, ipa LOADED + same hook =
# hard hang and a watchdog reset (docs/campaign/ws-05-suspend.md RESULT 4,
# arm E). Taking GSI's real CH_STOP path instead was tried and failed on the
# hardware -- CH_STOP never completes on IPA v3.1 with the modem attached, see
# ws-05-suspend.md "Blacklisting ipa". Mainline's "GSI does not implement
# suspend/resume below v4.0" is accurate for this SoC.
#
# The cost is mobile data: no `ipa` means no rmnet_ipa0, so ModemManager sees
# the modem but has no data netdev. Calls/SMS are unaffected. WiFi, GPS and
# everything else are unaffected.
#
# Kernel cmdline rather than a `blacklist ipa` line in modprobe.conf on
# purpose: modprobe.d only blocks alias-driven loads, while the cmdline form
# is enforced inside the kernel's own module loader, so nothing -- not an
# explicit modprobe, not a later udev rule -- can put the driver back and
# silently re-arm the hang.
modprobe.blacklist=ipa
