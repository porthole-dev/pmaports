# A panic on this device is indistinguishable from a hard hang, and that has
# cost real debugging time.
#
# Alpine's /usr/lib/sysctl.d/00-alpine.conf sets kernel.panic = 120, which
# silently overrides the panic=10 this device puts on the kernel cmdline. So
# every panic left the phone dead for two full minutes before rebooting -- and
# with no console and nothing surviving in pstore, that looks exactly like a
# wedged SoC. Sessions have chased "SoC hangs" that were very likely panics
# nobody could see.
#
# 5s is long enough for netconsole to flush the backtrace to the host and short
# enough that the reboot reads as a reboot. Sorted 99- so it wins over 00-alpine.
kernel.panic = 5

# A panic is more useful than a limping kernel here: it is the only event that
# reliably produces a backtrace on the wire. Already the kernel default, stated
# explicitly so a future sysctl drop-in has to argue with it.
kernel.panic_on_oops = 1

# 0x20 = PANIC_PRINT_ALL_CPU_BT: dump every CPU's backtrace, via NMI, before the
# reboot. The panicking CPU is the one that noticed; on a hard hang it is the
# watchdog bark handler, and the CPU that is actually wedged is one of the other
# seven. Without this, a hang panic names the messenger. Verified on this device
# that all-CPU NMI backtraces do reach netconsole (sysrq-l, FINDINGS 2026-08-20).
kernel.panic_print = 32
