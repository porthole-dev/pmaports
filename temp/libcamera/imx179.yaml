%YAML 1.1
---
# Google Pixel 2 XL (taimen) front camera.
# Single colour correction matrix extracted from the vendor chromatix
# (libchromatix_imx179_pixel_res0_snapshot_isp.so); the vendor tuning
# uses one matrix for all illuminants. Black level: Sony pedestal 64
# at 10 bits.
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
      # Grey world. The curve only turns a manual ColourTemperature into
      # gains: the reciprocals of this module's own OTP calibration ratios
      # (at24 EEPROM, r/gr and b/gr at the vendor's 3100/4000/5800 K).
      colourGains:
        - ct: 3100
          gains: [ 1.3654, 2.9771 ]
        - ct: 4000
          gains: [ 1.6100, 1.9357 ]
        - ct: 5800
          gains: [ 1.9920, 1.5586 ]
  - Ccm:
      ccms:
        - ct: 4500
          ccm: [ 1.7387, -0.8114,  0.0727,
                -0.1948,  1.4452, -0.2504,
                 0.0844, -0.7789,  1.6945 ]
  - Adjust:
  - Agc:
...
