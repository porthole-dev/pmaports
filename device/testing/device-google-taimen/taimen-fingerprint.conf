# fpc1020 loads cmnlib and the fingerprint trustlet from
# /usr/lib/firmware/qcom/msm8998/taimen/ when fprintd first opens the sensor.
# Through the search path the initramfs leaves behind
# (/lib/firmware/postmarketos) that request_firmware() fails with ELOOP,
# while the same files load through the real directory; measured on taimen,
# root cause not established. Point the loader at the real directory before
# anything opens the sensor.
w /sys/module/firmware_class/parameters/path - - - - /usr/lib/firmware

# The trustlet's template database; see the fprintd drop-in.
d /var/lib/fpctee 0700 root root -
