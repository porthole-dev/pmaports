# PID 1 seatbelt.
#
# The worst defect on this device is PID 1 taking a SIGSEGV and FREEZING: ICMP
# keeps answering and already-running daemons keep working, so the phone looks
# alive, but nothing can open a new session -- ssh hangs in PAM because
# pam_systemd -> logind -> the bus -> a frozen PID 1. From the outside this is
# indistinguishable from a healthy phone until you try to log in.
#
# A phone that reboots beats a phone that wedges silently, and this is also
# what lets orderly_poweroff() ever run, which is the only thermal protection
# there is on this device.
#
# systemd 261 supports CrashAction= (v256+). Verified present as an exact
# string in /usr/lib/systemd/systemd on this device before shipping this file
# -- note that `systemctl show -p CrashAction` prints NOTHING even when it is
# supported, so do not use that to test for it.
#
# Deliberately NOT combined with the `audit=0` cmdline change: if both land at
# once and the freeze stops, you will not know which one did it.
[Manager]
CrashAction=reboot
