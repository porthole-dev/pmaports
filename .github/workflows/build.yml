# Build this branch's forked packages natively on aarch64 and publish them as
# a signed apk repository that pmbootstrap and apk read directly.
#
# Builds run in a privileged Alpine container through
# .github/scripts/run-pmbootstrap.sh, the way pmaports' own CI runs
# pmbootstrap. Publishing needs the PACKAGES_TOKEN and PACKAGES_SIGNING_KEY
# secrets of the "publish" environment and is skipped without them. While the
# packages repository is private, the optional PACKAGES_READ_TOKEN repository
# secret lets "Select packages" see what is already published. Design:
# ARCHITECTURE.md in the packages repository.
name: Build

on:
  push:
    branches: [taimen-bringup]
  pull_request:
    branches: [taimen-bringup]
  workflow_dispatch:
    inputs:
      packages:
        description: Build only these aports (space separated)
        type: string
        default: ""
      heavy:
        description: Allow heavy-tier aports (multi-hour builds)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.ref_name != 'taimen-bringup' }}

env:
  # The one place that names the organization and the published repository.
  PACKAGES_REPO: porthole-dev/pmos-packages
  SIGNING_KEY_NAME: porthole-dev-packages-20260915.rsa
  PACKAGER: Giuseppe Maggio <jertlok@proton.me>
  ALPINE: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

jobs:
  select:
    name: Select packages
    runs-on: ubuntu-24.04
    container: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - run: apk -q add git github-cli jq python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes and manual runs also build the forked aports that are not
          # published yet, measured from the merge base with upstream
          # pmaports: that needs the whole history, commits and trees only.
          fetch-depth: ${{ github.event_name == 'pull_request' && 100 || 0 }}
          filter: blob:none
          persist-credentials: false
      - name: Download the published index
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -u
          branch=$(python3 -c 'import configparser as c; p = c.ConfigParser(); p.read("pmaports.cfg"); ch = c.ConfigParser(); ch.read("channels.cfg"); print(ch[p["pmaports"]["channel"]]["branch_pmaports"])')
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          fetch() { # directory tag
            mkdir -p "/index/$1"
            if [ -n "$GH_TOKEN" ]; then
              out=$(gh release download "$2" -R "$PACKAGES_REPO" -p APKINDEX.tar.gz -D "/index/$1" 2>&1) && return
              case "$out" in *"release not found"*) touch "/index/$1/NO_RELEASE" ;; esac
            else
              wget -q -O "/index/$1/APKINDEX.tar.gz" "https://github.com/$PACKAGES_REPO/releases/download/$2/APKINDEX.tar.gz" ||
                rm -f "/index/$1/APKINDEX.tar.gz"
            fi
          }
          fetch pmaports "$branch/aarch64"
          fetch systemd "systemd/$branch/aarch64"
          find /index -type f
      - id: select
        env:
          PACKAGES: ${{ inputs.packages }}
          HEAVY: ${{ inputs.heavy }}
          FORKS: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global --add safe.directory "$PWD"
          CI_MERGE_REQUEST_DIFF_BASE_SHA=$(sh .github/scripts/base-commit.sh)
          export CI_MERGE_REQUEST_DIFF_BASE_SHA
          INDEX_DIR=/index sh .github/scripts/run-pmbootstrap.sh --no-init 'python3 .github/scripts/packages.py select'
          echo "packages=$(cat /work/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  build:
    # GitHub appends the package, "Build (mesa)"; a skipped job shows "Build".
    name: Build
    needs: select
    if: needs.select.outputs.packages != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/work/cache_apk_aarch64
          key: pmbootstrap-apk-aarch64-${{ github.run_id }}
          restore-keys: pmbootstrap-apk-aarch64-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/work/cache_ccache_aarch64
            ${{ runner.temp }}/work/cache_distfiles
          key: pmbootstrap-build-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: pmbootstrap-build-${{ matrix.package }}-
      - name: Build the package
        env:
          PKG: ${{ matrix.package }}
        run: |
          df -h /
          docker run --rm --privileged \
            -v "$PWD:/pmaports" -w /pmaports -v "$RUNNER_TEMP/work:/work" \
            -e HOST_UID="$(id -u)" -e PACKAGER -e PKG \
            -e PACKAGES_URL="https://github.com/$PACKAGES_REPO/releases/download" \
            "$ALPINE" sh .github/scripts/run-pmbootstrap.sh 'python3 .github/scripts/packages.py build "$PKG"'
          df -h /
      - name: Check packages for build machine details
        run: |
          set -eu
          fail=0
          for apk in "$RUNNER_TEMP"/work/packages/*/aarch64/*.apk; do
            dir=$(mktemp -d)
            tar -xzf "$apk" -C "$dir" 2>/dev/null
            echo "${apk##*/packages/}"
            grep -E '^(pkgname|pkgver|packager|maintainer|origin|commit) ' "$dir/.PKGINFO" | sed 's/^/  /'
            for needle in "$(hostname)" /home/runner "$GITHUB_WORKSPACE"; do
              if grep -rlaF -- "$needle" "$dir" >/dev/null; then
                echo "::error::${apk##*/} contains a build machine path or hostname"
                fail=1
              fi
            done
            rm -rf "$dir"
          done
          exit "$fail"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.package }}
          # Keeps the <local repository>/aarch64/ layout that publish maps to releases.
          path: |
            ${{ runner.temp }}/work/packages/
            !${{ runner.temp }}/work/packages/**/APKINDEX.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish repository
    needs: [select, build]
    if: github.event_name == 'push' && github.ref_name == 'taimen-bringup' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    # Holds the signing key and write token; restrict it to taimen-bringup.
    environment: publish
    steps:
      - id: secrets
        name: Check for publishing secrets
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Publishing skipped: PACKAGES_TOKEN or PACKAGES_SIGNING_KEY is not set"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Sign and upload the repositories
        if: steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          BRANCH: ${{ needs.select.outputs.branch }}
        run: |
          set -eu
          keys=$RUNNER_TEMP/keys
          (umask 077; mkdir -p "$keys"; printf '%s\n' "$SIGNING_KEY" > "$keys/$SIGNING_KEY_NAME")
          trap 'rm -rf "$keys"' EXIT
          # pmbootstrap's local repositories: edge -> main/aarch64,
          # systemd-edge -> systemd/main/aarch64 (mirrors.systemd_custom).
          for local in $(ls "$RUNNER_TEMP/packages"); do
            case "$local" in
            systemd-*) tag=systemd/$BRANCH/aarch64 ;;
            *) tag=$BRANCH/aarch64 ;;
            esac
            echo "::group::$local -> release $tag"
            repo=$RUNNER_TEMP/repo/$local
            mkdir -p "$repo"
            gh release view "$tag" -R "$PACKAGES_REPO" >/dev/null 2>&1 ||
              gh release create "$tag" -R "$PACKAGES_REPO" --title "$tag" \
                --notes "apk repository for pmaports branch $BRANCH"
            gh release download "$tag" -R "$PACKAGES_REPO" -p '*.apk' -D "$repo" 2>/dev/null || true
            docker run --rm -v "$repo:/repo" -v "$RUNNER_TEMP/packages/$local/aarch64:/new:ro" \
              -v "$keys:/keys:ro" -v "$PWD/.github/keys:/pubkeys:ro" \
              -e ARCH=aarch64 -e KEY="$SIGNING_KEY_NAME" -e PACKAGER \
              -e DESCRIPTION="$PACKAGES_REPO $tag" \
              "$ALPINE" sh -s < .github/scripts/publish-repo.sh
            if [ -s "$repo/.upload" ]; then
              # New packages, then the index, then remove superseded packages:
              # the published index never names a missing file.
              (cd "$repo" && grep -vx APKINDEX.tar.gz .upload | xargs -r gh release upload "$tag" -R "$PACKAGES_REPO" --clobber)
              gh release upload "$tag" -R "$PACKAGES_REPO" --clobber "$repo/APKINDEX.tar.gz"
              xargs -r -n1 gh release delete-asset "$tag" -R "$PACKAGES_REPO" -y < "$repo/.remove"
              # Verify what was published, not what was built.
              check=$RUNNER_TEMP/check/$local
              mkdir -p "$check"
              gh release download "$tag" -R "$PACKAGES_REPO" -p APKINDEX.tar.gz -D "$check"
              cmp "$check/APKINDEX.tar.gz" "$repo/APKINDEX.tar.gz"
              docker run --rm -v "$check:/check:ro" -v "$PWD/.github/keys:/pubkeys:ro" "$ALPINE" \
                apk verify --keys-dir /pubkeys /check/APKINDEX.tar.gz
              gh release view "$tag" -R "$PACKAGES_REPO" --json assets --jq '.assets[].name' | sort > "$check/assets"
              tar -xzOf "$check/APKINDEX.tar.gz" APKINDEX 2>/dev/null |
                awk -F: '/^P:/ { p = $2 } /^V:/ { print p "-" $2 ".apk" }' | sort > "$check/indexed"
              if comm -23 "$check/indexed" "$check/assets" | grep .; then
                echo "::error::The index names packages that are not release assets"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
