# One job of the staged chromium build, called by chromium.yml. Design:
# .github/CHROMIUM.md.
#
#   prep     build.yml's build of chromium, stopped when ninja starts; the
#            work directory is stored as the state's prep layer
#   build    restore, run ninja until the deadline, store out/bld
#   package  restore, abuild's build check rootpkg, upload the apks
name: Chromium stage

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      runner:
        type: string
        required: true
      tag:
        type: string
        required: true
      stage:
        description: This job's place in the chain (build mode)
        type: number
        default: 0
      stages:
        description: Build jobs in the chain (build mode)
        type: number
        default: 0
      stage_minutes:
        description: Cap on ninja's time, 0 for as long as the job allows
        type: number
        default: 0
    outputs:
      done:
        description: ninja has finished; the package job can run
        value: ${{ jobs.stage.outputs.done }}

permissions:
  contents: write

env:
  PACKAGES_REPO: porthole-dev/pmos-packages
  PACKAGER: Giuseppe Maggio <jertlok@proton.me>
  ALPINE: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  stage:
    name: ${{ inputs.mode == 'build' && format('Build {0}', inputs.stage) || (inputs.mode == 'prep' && 'Prepare sources' || 'Package') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      done: ${{ steps.save.outputs.done }}
    steps:
      - name: Start the clock
        run: |
          {
            echo "START=$(date +%s)"
            echo "WORK=$RUNNER_TEMP/work"
            # The build runs in a container with its own UTS namespace, so the
            # only hostname a package can leak is that container's, never this
            # runner's. Name it here: unnamed it is a 12 hex digit container
            # id that the leak check downstream cannot know, and a short
            # generic name would match by accident inside a 200 MB binary.
            echo "BUILD_HOST=chromium-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the runner
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq zstd; }
          df -h /
          # Preinstalled toolchains this job never uses (the build runs in
          # pmbootstrap chroots).
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/lib/jvm /usr/share/swift /usr/local/share/powershell \
            /usr/lib/google-cloud-sdk /opt/az /usr/local/julia* /opt/microsoft /opt/google
          docker image prune -af >/dev/null
          df -h /
      - name: Restore the state
        if: inputs.mode != 'prep'
        run: bash .github/scripts/chromium-state.sh restore "$TAG" "$WORK"
      # Not part of the state: the compiler cache is shared across chromium
      # versions, which is the only time it pays (within one version the out
      # directory is the cache). Restored for prep too, so its forked build
      # dependencies feed it; not for package, which compiles nothing and
      # would download gigabytes to use none of them.
      - name: Restore the compiler cache
        if: inputs.mode != 'package'
        run: |
          bash .github/scripts/chromium-state.sh ccache-restore aarch64 "$WORK"
          df -h /
      - name: ${{ inputs.mode == 'build' && 'Run ninja' || (inputs.mode == 'prep' && 'Fetch, unpack, patch, configure' || 'Finish, check and package') }}
        id: run
        env:
          MODE: ${{ inputs.mode }}
          STAGE_MINUTES: ${{ inputs.stage_minutes }}
        run: |
          set -eu
          # Stop ninja with enough of the 6 h left to store out/bld.
          deadline=$((START + (360 - 45) * 60))
          if [ "$STAGE_MINUTES" -gt 0 ] && [ $(($(date +%s) + STAGE_MINUTES * 60)) -lt "$deadline" ]; then
            deadline=$(($(date +%s) + STAGE_MINUTES * 60))
          fi
          case "$MODE" in
          prep) init=''; args=prep ;;
          build) init=--no-init; args="build $deadline"; echo "ninja stops at $(date -u -d "@$deadline")" ;;
          package) init=--no-init; args=package ;;
          esac
          # The package job has twice lost its runner mid-check: once with a
          # shutdown signal and no exit status, once with no logs uploaded at
          # all. That is the VM dying, not a command failing, and a dead VM
          # uploads nothing -- so sample memory to stdout, where the last
          # readings before a death are already in the log.
          # Three of the four package jobs that killed their runner uploaded
          # no logs at all: a VM that dies takes its log upload with it, and
          # stdout is therefore not an evidence channel for this failure. So
          # the heartbeat leaves the machine while the machine is still alive,
          # as an asset on the state's own draft release.
          beat=$RUNNER_TEMP/heartbeat.txt
          : > "$beat"
          (
            while :; do
              {
                date -u +%H:%M:%S
                # Shmem and Cached ruled out tmpfs and page cache, and the top
                # RSS on the box was 151M while 12.6 GB went in 93 seconds.
                # AnonPages says process memory; Slab/SUnreclaim/PageTables say
                # the kernel; Hugetlb says neither is being counted.
                awk '/^(MemFree|MemAvailable|SwapFree|Cached|Shmem|AnonPages|Mapped|Dirty|Writeback|Slab|SReclaimable|SUnreclaim|PageTables|KernelStack|Hugetlb|CommitLimit|Committed_AS):/ {printf " %s%dM", $1, $2/1024}' /proc/meminfo
                ps -eo rss= | awk '{n++; s+=$1} END {printf " procs=%d rss_total=%dM", n, s/1024}'
                ps -eo rss=,comm= --sort=-rss | awk 'NR<11 {printf " | %dM %s", $1/1024, $2}'
                printf '\n'
              } >> "$beat"
              tail -c 100000 "$beat" > "$beat.tail"
              gh release upload "$TAG" "$beat.tail" -R "$GITHUB_REPOSITORY" --clobber >/dev/null 2>&1 || true
              cat "$beat.tail" | tail -n 1
              sleep 15
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          docker run --rm --privileged --hostname "$BUILD_HOST" \
            -v "$PWD:/pmaports" -w /pmaports -v "$WORK:/work" \
            -e HOST_UID="$(id -u)" -e PACKAGER \
            -e PACKAGES_URL="https://github.com/$PACKAGES_REPO/releases/download" \
            "$ALPINE" sh .github/scripts/run-pmbootstrap.sh ${init:+"$init"} "python3 .github/scripts/chromium-stage.py $args"
          df -h /
          # An in-guest OOM kill that did not take the runner with it.
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|killed process' | tail -n 20 || true
      - name: Store the state
        id: save
        # After a failed stage too: samurai's log only records finished edges,
        # so its progress is valid, and a re-run continues from it.
        if: ${{ !cancelled() && inputs.mode != 'package' && steps.run.outcome != 'skipped' }}
        env:
          MODE: ${{ inputs.mode }}
          STAGE: ${{ inputs.stage }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -eu
          result=$WORK/chromium/result.json
          if [ ! -f "$result" ] || { [ "$MODE" = prep ] && ! jq -e .ok "$result" >/dev/null; }; then
            echo "::warning::nothing to store"
            exit 0
          fi
          bash .github/scripts/chromium-state.sh save "$TAG" "$WORK" | tee "$RUNNER_TEMP/saved.json"
          done=$(jq -r .done "$RUNNER_TEMP/saved.json")
          echo "done=$done" >> "$GITHUB_OUTPUT"
          {
            echo "### $TAG"
            echo '```json'
            cat "$RUNNER_TEMP/saved.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = build ] && [ "$done" != true ] && [ "$STAGE" = "$STAGES" ]; then
            echo "::warning::ninja has not finished after the last build job of this run. Run the workflow again: it resumes from the stored state."
          fi
      - name: Store the compiler cache
        # After a failed stage too: the objects it did compile are cached, and
        # the cache is read-only to correctness -- a wrong entry is a miss.
        if: ${{ !cancelled() && inputs.mode == 'build' && steps.run.outcome != 'skipped' }}
        run: bash .github/scripts/chromium-state.sh ccache-save aarch64 "$WORK"
      - name: Check the packages this stage built
        if: inputs.mode == 'package'
        run: |
          set -eu
          # An empty glob must say so, not hand tar the literal pattern.
          shopt -s nullglob
          # chromium-stage.py builds for aarch64 whatever the runner is: the
          # runner input picks native or cross compilation, not the target.
          arch=aarch64
          apks=("$WORK"/packages/*/"$arch"/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::the package stage produced no apks in $WORK/packages/*/$arch/"
            find "$WORK/packages" -maxdepth 3 | head -n 50
            exit 1
          fi
          # One local repository, one architecture: the layout the publish job
          # maps onto release assets, and the layout actions/upload-artifact
          # roots the artifact at. Keep it a checked fact, not a coincidence.
          repos=$(printf '%s\n' "${apks[@]}" | sed -E 's![^/]+$!!' | sort -u)
          if [ "$(printf '%s\n' "$repos" | wc -l)" != 1 ]; then
            echo "::error::expected one local repository under $WORK/packages, found:"
            printf '%s\n' "$repos"
            exit 1
          fi
          echo "${#apks[@]} apk(s) in ${repos#"$WORK/packages/"}"

          # What a package could carry off this machine. The build runs in a
          # container, so the only hostname it can see is that container's,
          # named in "Start the clock"; and its bind mounts put the checkout
          # and the work directory at /pmaports and /work, so the two runner
          # paths are belt and braces. Every needle is long enough that a
          # match in a 200 MB binary means a leak and not a coincidence, and
          # each one is planted in a binary probe first, so a scan that cannot
          # match anything fails here instead of passing everything.
          needles=("$BUILD_HOST" /home/runner "$GITHUB_WORKSPACE")
          probe=$(mktemp -d)
          head -c 4096 /dev/urandom > "$probe/binary"
          for needle in "${needles[@]}"; do
            if [ "${#needle}" -lt 8 ]; then
              echo "::error::'$needle' is too short to search a binary for"
              exit 1
            fi
            printf '%s' "$needle" >> "$probe/binary"
            grep -rlaF -- "$needle" "$probe" >/dev/null ||
              { echo "::error::the leak scan cannot find a planted '$needle'"; exit 1; }
          done
          rm -rf "$probe"

          fail=0
          kept=0
          for apk in "${apks[@]}"; do
            dir=$(mktemp -d)
            tar -xzf "$apk" -C "$dir" 2>/dev/null
            # prep also built the forked build dependencies that were not
            # published yet; build.yml publishes those.
            if ! grep -qx 'origin = chromium' "$dir/.PKGINFO"; then
              echo "not publishing ${apk##*/}: not built from temp/chromium"
              rm -rf "$dir" "$apk"
              continue
            fi
            kept=$((kept + 1))
            echo "${apk##*/packages/}"
            grep -E '^(pkgname|pkgver|packager|maintainer|origin|commit) ' "$dir/.PKGINFO" | sed 's/^/  /'
            for needle in "${needles[@]}"; do
              if grep -rlaF -- "$needle" "$dir" >/dev/null; then
                echo "::error::${apk##*/} contains a build machine path or hostname"
                fail=1
              fi
            done
            rm -rf "$dir"
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::none of the ${#apks[@]} apks was built from temp/chromium"
            exit 1
          fi
          exit "$fail"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.mode == 'package'
        with:
          name: packages-chromium
          # The <local repository>/aarch64/ layout that the publish job maps to releases.
          path: |
            ${{ runner.temp }}/work/packages/
            !${{ runner.temp }}/work/packages/**/APKINDEX.tar.gz
          if-no-files-found: error
          retention-days: 7
