# systemd-resolved defaults to DNSSEC=allow-downgrade, which on this device
# turns into a permanent busy-loop.
#
# Measured 2026-08-20: 4181 "DNSSEC validation failed" lines in ten minutes
# (~7/s), and the seven noisiest journal entries of the whole boot were all
# this one loop retrying pool.ntp.org against a resolver that strips
# signatures. The consequences are not cosmetic:
#
#   - systemd-timesyncd never resolves its NTP pool, so the clock never syncs.
#     The device believed it was 2026-07-26 while the host was at 2026-08-20.
#     Every host-vs-device log correlation was 25 days out, and pam logged
#     "account <user> has password changed in future" 59 times.
#   - ~7 journal writes a second to flash, forever, on an idle phone.
#   - the CPU never fully settles, which shows up in the idle thermals.
#
# allow-downgrade is meant to fall back when the upstream resolver does not
# support DNSSEC. It does not converge here, so ask for nothing instead.
[Resolve]
DNSSEC=no
