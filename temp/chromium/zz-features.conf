# LAST file in /etc/chromium, and the only one allowed to write --enable-features
# or --disable-features. Everything else contributes names to a list.
#
# THE BUG THIS EXISTS TO PREVENT. base::CommandLine keeps only the LAST
# occurrence of a switch. So two conf files that each do the obvious thing:
#
#     # a-thing.conf
#     CHROMIUM_FLAGS="$CHROMIUM_FLAGS --enable-features=Foo"
#     # b-thing.conf
#     CHROMIUM_FLAGS="$CHROMIUM_FLAGS --enable-features=Bar"
#
# do NOT get Foo and Bar. They get Bar. Foo is silently gone, and a-thing.conf
# is dead code that still reads as if it works. This is not hypothetical -- the
# same shape deleted the V4L2 GStreamer ranks when a second environment.d file
# assigned the same variable, see
# brain/traps/the-av1-demotion-deleted-the-v4l2-ranks.
#
# THE RULE. A conf file appends a feature NAME to one of the two lists below,
# using this idiom (POSIX sh, works whether or not the list is already set):
#
#     CHROMIUM_ENABLE_FEATURES="${CHROMIUM_ENABLE_FEATURES:+$CHROMIUM_ENABLE_FEATURES,}MyFeature"
#
# and this file, which the launcher's glob sources last, emits each list once
# as a single comma-joined switch. A third contributor then composes instead of
# overwriting. Non-feature flags are unaffected: append those to CHROMIUM_FLAGS
# directly, as many times as you like.
#
# Named zz-* so it sorts after every plausible device or vendor conf. If you
# ever add one that sorts after this, it must not set --enable-features either.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS${CHROMIUM_ENABLE_FEATURES:+ --enable-features=$CHROMIUM_ENABLE_FEATURES}"
CHROMIUM_FLAGS="$CHROMIUM_FLAGS${CHROMIUM_DISABLE_FEATURES:+ --disable-features=$CHROMIUM_DISABLE_FEATURES}"
