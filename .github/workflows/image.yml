name: Device image

on:
  push:
    branches: [taimen-bringup]
  pull_request:
    branches: [taimen-bringup]
  workflow_dispatch:
    inputs:
      device:
        description: Device codename, or all reviewed devices
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: device-images
  cancel-in-progress: false

env:
  ALPINE: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.devices.outputs.devices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer safety
        run: python3 .github/scripts/test-bundle.py
      - id: devices
        env:
          REQUESTED_DEVICE: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          devices = json.loads(pathlib.Path(".github/image-devices.json").read_text())
          requested = os.environ["REQUESTED_DEVICE"] or "all"
          names = list(devices) if requested == "all" else [requested]
          rows = [{"device": name, "runner": devices[name]["runner"], "grant": devices[name]["grant_variable"], "name": devices[name]["name"]} for name in names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("devices=" + json.dumps(rows) + "\n")
          PY
  image:
    if: github.repository_owner == 'porthole-dev' && github.ref == 'refs/heads/taimen-bringup' && github.event_name == 'workflow_dispatch'
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.devices) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: porthole-dev/porthole
          ref: 968011cad210262b3f1f8d31238b89c9c89f663c
          path: verification
          persist-credentials: false
      - name: Check the reviewed firmware grant
        env:
          FIRMWARE_GRANT: ${{ vars[matrix.grant] }}
        run: test "$FIRMWARE_GRANT" = approved
      - name: Assemble and verify the release candidate
        env:
          FIRMWARE_GRANT: ${{ vars[matrix.grant] }}
          IMAGE_DEVICE: ${{ matrix.device }}
          PORTHOLE_PMOS_PASSWORD: ${{ secrets.PORTHOLE_PMOS_PASSWORD }}
          PACKAGES_URL: https://github.com/porthole-dev/pmos-packages/releases/download
        run: |
          docker run --rm --privileged \
            -v "$PWD:/pmaports" -w /pmaports -v "$PWD/verification:/verification:ro" -v "$RUNNER_TEMP/work:/work" \
            -e HOST_UID="$(id -u)" -e FIRMWARE_GRANT -e IMAGE_DEVICE \
            -e PORTHOLE_PMOS_PASSWORD -e PACKAGES_URL \
            "$ALPINE" sh .github/scripts/run-pmbootstrap.sh 'sh .github/scripts/image.sh'
      - name: Attest the candidate assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/work/image/SHA256SUMS
      - name: Publish the experimental candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_DEVICE: ${{ matrix.device }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          tag=$IMAGE_DEVICE-candidate-${GITHUB_RUN_NUMBER}
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --draft \
            --title "$IMAGE_NAME · experimental candidate ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/work/image/INSTALL.md" "$RUNNER_TEMP"/work/image/*
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$tag" -D "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          sha256sum -c SHA256SUMS
          gh attestation verify boot.img -R "$GH_REPO"
          if [ -f dtbo.img ]; then gh attestation verify dtbo.img -R "$GH_REPO"; fi
          gh attestation verify "$IMAGE_DEVICE.img.gz" -R "$GH_REPO"
          gh attestation verify "$IMAGE_DEVICE-install.zip" -R "$GH_REPO"
          python3 "$IMAGE_DEVICE-install.zip" --dry-run
          gh release edit "$tag" --draft=false

  refresh-website:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: publish
    steps:
      - name: Refresh organization website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Website refresh uses the scheduled Docs workflow. Set WEBSITE_TOKEN (Actions write on porthole-dev/porthole) for immediate refresh." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run docs.yml -R porthole-dev/porthole --ref main
