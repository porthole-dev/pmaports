# Build policy overrides. Maintained aports are generated from porthole's
# profile/shared manifests into maintained-aports.json. Automatic builds select
# changed packages; workflow_dispatch with forks=true also fills missing prebuilts.
# No merge-base discovery: public history was rewritten in September 2026.
#
# This file only overrides that selection:
#
#   heavy    multi-hour builds: only on a manual run with heavy=true, never by
#            default
#   exclude  forked, but never built, checked or published by CI (a manual
#            run that names it still builds it)
#   unpublished
#            built and checked when a change touches it, never published.
#            For host tools that run in pmbootstrap's native chroot: an
#            aarch64 build is of no use to an x86_64 host, which reads the
#            (empty) x86_64 index and builds its own.
#
# firmware-* is refused unless FIRMWARE_GRANT_TAIMEN=approved is set after the
# Taimen redistribution grant is documented. The exception is limited to the
# Taimen base and fingerprint APKs in the publisher's code.

heavy webkit2gtk-6.0
heavy epiphany
heavy chromium

unpublished crossdirect
