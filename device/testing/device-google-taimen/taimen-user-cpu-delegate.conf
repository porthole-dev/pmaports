# taimen-uclamp-session needs to write cpu.uclamp.min on user-<uid>.slice
# (see that script's header for the full reasoning). That file only exists
# if the cgroup-v2 "cpu" controller is enabled there, which requires it
# enabled in user.slice's cgroup.subtree_control -- a cgroup's own
# controller files exist only where its PARENT pushed the controller down.
#
# Measured live on-device (read-only): it currently is NOT.
#   cat /sys/fs/cgroup/user.slice/user-10000.slice/cgroup.controllers
#   -> memory pids
# no cpu. Upstream systemd's user@.service already carries
# `Delegate=pids memory cpu` in its own unit file, which is what makes
# "memory pids" show up there today (systemd pushes every controller listed
# in Delegate= up through every ancestor cgroup, not just the unit's own).
# The live read disagrees with that: cpu is missing. Rather than guess why,
# this drop-in restates the full delegated set including cpu explicitly, so
# the outcome does not depend on whatever the base package's value actually
# is on this image.
#
# This does not, by itself, make cpu.uclamp.min exist: CONFIG_UCLAMP_TASK_GROUP
# is also required (kernel not flashed yet as of this drop-in landing -- see
# taimen-uclamp-session's header). Both pieces need to be in place together;
# this is the systemd side of it.
[Service]
Delegate=pids memory cpu
