# The bootloader leaves the Qualcomm watchdog armed; the kernel stops petting
# it once WATCHDOG_OPEN_TIMEOUT (180 s) expires with no userspace opening
# /dev/watchdog, and the 30 s hardware timer then resets the phone even when
# fully idle. Have systemd own and pet it.
# 2026-08-19: lowered 60s -> 30s. 60 was UNSETTABLE and therefore worse than
# either bound: qcom,kpss-wdt on msm8998 has max_tick_count = 0xFFFFF over a
# 32764 Hz sleep clock, so its max_timeout is 32 s. WDIOC_SETTIMEOUT(60)
# returns EINVAL, and systemd's response to that is to DISARM and close
# /dev/watchdog -- "Failed to set watchdog hardware timeout to 1min: Invalid
# argument". So the drop-in that exists to make systemd own the watchdog was
# switching it off. 30 s is the largest value this hardware accepts.
#
# The 2026-08-18 reasoning below also rested on a misattribution. One of its
# three "spurious resets on a healthy phone" was camera bring-up, and that was
# not a watchdog budget problem at all -- it was an oops in vfe_pm_domain_off()
# reaching panic=10, fixed by 943ebe467ccf. A panic writes nothing to disk, so
# it presented exactly like a missed pet.
#
# Note the hardware watchdog stays armed regardless of any of this: the cmdline
# carries qcom_wdt.arm_on_probe=1, so the kernel arms it at probe and its
# worker pets it. This drop-in governs systemd's supervision on top, which is
# what notices a userspace stall rather than a dead kernel.
#
# 2026-08-18: raised 15s -> 60s. Three spurious resets in one day on a HEALTHY
# phone -- two during `apk add`, one during camera bring-up -- each
# bootreason=watchdog, with three hours of untouched idle in between showing
# the device is stable when nothing is asking it to work. A 15 s budget is
# shorter than an apk transaction's I/O stall, so ordinary use was rebooting
# the phone and every such reboot got misattributed to whatever was being
# tested at the time. 60 s still fires far inside the bootloader's own fuse,
# which is what this drop-in exists to beat.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=2min

# 2026-08-20: added the pretimeout. A hard SoC hang under GPU load reset the
# phone with EVERY kernel channel silent -- netconsole's last line and
# `journalctl -b -1 -k`'s last line were the same one -- and bootreason=watchdog
# was all that survived. The pretimeout governor was already `panic`, but the
# pretimeout itself was 1 s against a 30 s timeout, and one second is not enough
# to dump 8 CPUs over UDP. sysfs `pretimeout` is READ-ONLY (WDIOC_SETPRETIMEOUT
# only), and pid 1 holds /dev/watchdog0 exclusively, so systemd is the only way
# to set it. Now the bark lands at 20 s, panics, and the backtrace escapes over
# netconsole before the bite at 30 s.
# Pair it with `sysctl kernel.panic_print=0x20` to get all-CPU backtraces, which
# is what actually names the wedged CPU.
RuntimeWatchdogPreSec=10
RuntimeWatchdogPreGovernor=panic
