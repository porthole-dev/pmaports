name: Package existing device release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public candidate tag (image bytes are preserved)
        required: true
        type: string
      format:
        description: Installer format (existing assets are preserved)
        type: choice
        options: [native, python]
        default: native
      device:
        description: Reviewed device codename
        default: google-taimen
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: device-images
  cancel-in-progress: false

jobs:
  bundle:
    if: github.repository_owner == 'porthole-dev' && github.ref == 'refs/heads/taimen-bringup'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: package
        name: Verify and package existing public assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DEVICE: ${{ inputs.device }}
          BUNDLE_KIND: ${{ inputs.format }}
        run: |
          python3 .github/scripts/test-bundle.py
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-z0-9-]+-candidate-[0-9]+', os.environ['RELEASE_TAG'])
          assert re.fullmatch(r'[a-z0-9-]+', os.environ['IMAGE_DEVICE'])
          PY
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          mkdir "$RUNNER_TEMP/image"
          gh release download "$RELEASE_TAG" -D "$RUNNER_TEMP/image" --skip-existing
          case "$BUNDLE_KIND" in
            native) suffix=native-v2; checksums=NATIVE-V2-BUNDLE-SHA256SUMS;;
            python) suffix=install; checksums=BUNDLE-SHA256SUMS;;
            *) exit 1;;
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/image/$checksums" ]; then
            (cd "$RUNNER_TEMP/image" && sha256sum -c "$checksums")
            gh attestation verify "$RUNNER_TEMP/image/$IMAGE_DEVICE-$suffix.zip" -R "$GH_REPO"
            echo "Existing bundle verified and preserved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd "$RUNNER_TEMP/image" && sha256sum -c SHA256SUMS)
          gh attestation verify "$RUNNER_TEMP/image/$IMAGE_DEVICE.img.gz" -R "$GH_REPO"
          gh attestation verify "$RUNNER_TEMP/image/boot.img" -R "$GH_REPO"
          if [ -f "$RUNNER_TEMP/image/dtbo.img" ]; then gh attestation verify "$RUNNER_TEMP/image/dtbo.img" -R "$GH_REPO"; fi
          if [ "$BUNDLE_KIND" = native ]; then
            python3 .github/scripts/bundle.py "$RUNNER_TEMP/image" "$IMAGE_DEVICE" --native
            mkdir "$RUNNER_TEMP/extracted"
            unzip -q "$RUNNER_TEMP/image/$IMAGE_DEVICE-native-v2.zip" -d "$RUNNER_TEMP/extracted"
            bash "$RUNNER_TEMP/extracted/install.sh" --dry-run
            pwsh -NoProfile -File "$RUNNER_TEMP/extracted/install.ps1" -DryRun
          else
            python3 .github/scripts/bundle.py "$RUNNER_TEMP/image" "$IMAGE_DEVICE"
            python3 "$RUNNER_TEMP/image/$IMAGE_DEVICE-install.zip" --dry-run
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Attest complete bundle
        if: steps.package.outputs.created == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/image/${{ steps.package.outputs.checksums }}
      - name: Publish and independently verify the new download
        if: steps.package.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DEVICE: ${{ inputs.device }}
          BUNDLE_SUFFIX: ${{ steps.package.outputs.suffix }}
          BUNDLE_CHECKSUMS: ${{ steps.package.outputs.checksums }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/image/$IMAGE_DEVICE-$BUNDLE_SUFFIX.zip" "$RUNNER_TEMP/image/$BUNDLE_CHECKSUMS"
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download "$RELEASE_TAG" -p "$IMAGE_DEVICE-$BUNDLE_SUFFIX.zip" -p "$BUNDLE_CHECKSUMS" -D "$RUNNER_TEMP/downloaded"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c "$BUNDLE_CHECKSUMS")
          gh attestation verify "$RUNNER_TEMP/downloaded/$IMAGE_DEVICE-$BUNDLE_SUFFIX.zip" -R "$GH_REPO"

  refresh-website:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: publish
    steps:
      - name: Refresh organization website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Website refresh uses the scheduled Docs workflow. Set WEBSITE_TOKEN (Actions write on porthole-dev/porthole) for immediate refresh." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run docs.yml -R porthole-dev/porthole --ref main
