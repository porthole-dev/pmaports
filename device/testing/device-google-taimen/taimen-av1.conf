# Do not advertise AV1: this SoC cannot decode it, and never will.
#
# THE HARDWARE FACT, from the vendor firmware itself
#   Venus reports the codecs it can decode at runtime. venus/hfi_parser.c
#   parses HFI_PROPERTY_PARAM_CODEC_SUPPORTED out of the firmware's own
#   SYS_INIT response and assigns it verbatim:
#
#       parse_codecs():  core->dec_codecs = codecs->dec_codecs;
#
#   so this is the Qualcomm blob's declaration, not a driver allowlist. What it
#   declares on taimen, read back through the decoder node:
#
#       H264  VP80  VP90  HEVC  VC1G  VC1L  MPG4  MPG2  H263  XVID
#
#   AV01 is absent. It is also absent from the whole venus driver -- the string
#   "AV1" does not appear in drivers/media/platform/qcom/venus at all, and the
#   HFI codec enum has no constant for it. MSM8998 is 2017 silicon and the AV1
#   bitstream was frozen in 2018; Qualcomm's first AV1 hardware decoder shipped
#   in Snapdragon 8 Gen 2. There is no firmware update that changes this.
#
# WHY IT MATTERS
#   WebKit builds the codec list it advertises to pages -- MediaCapabilities,
#   MediaSource.isTypeSupported -- from the GStreamer registry. dav1ddec and
#   av1dec are present and rank primary/secondary, so WebKit tells YouTube it
#   supports AV1, and YouTube then serves AV1. Every frame is decoded on the
#   CPU by dav1d. Measured on this device: one WebKitWebProcess at 407% of a
#   core, the GPU pinned at 710 MHz, 76 C, ~1 fps of actual video, and the
#   battery discharging at 311-819 mA while plugged into a 474 mA charger.
#
# THIS IS THE VENDOR STRATEGY, NOT A WORKAROUND
#   Android solves this by construction: the platform advertises only what
#   MediaCodec can actually do (media_codecs.xml), AV1 is simply not in the
#   list on this SoC, and YouTube negotiates down to VP9 -- which Venus decodes
#   in hardware. Stock never offers a codec the silicon cannot run. All this
#   does is give the browser the same honesty.
#
#   GST_PLUGIN_FEATURE_RANK is GStreamer's own supported mechanism for exactly
#   this. NONE rather than MARGINAL is required: WebKit's registry scanner
#   collects decoders at GST_RANK_MARGINAL and above, so MARGINAL (64) would
#   still be advertised. NONE (0) removes it from the advertisement.
#
#   Precedent in this same package: taimen-gsk.conf sets
#   VK_LOADER_DRIVERS_DISABLE=*freedreno* because Turnip rejects the A540
#   outright, so no GTK4 app should pay to load an ICD guaranteed to fail.
#   Identical reasoning, different subsystem.
#
# THE TRADE, stated plainly
#   A local AV1 file will now fail to play rather than play at ~1 fps. That is
#   the intended behaviour and matches stock, but it IS a behaviour change: to
#   decode one anyway, override for that invocation only --
#
#       GST_PLUGIN_FEATURE_RANK=dav1ddec:PRIMARY <player> <file>
#
# ORDER OF OPERATIONS
#   This alone does nothing useful while WebKit cannot reach the hardware
#   decoder at all. The sandbox binds a hardcoded /dev/video0-2 and the Venus
#   decoder is /dev/video7, so v4l2 is invisible to the web process; without
#   temp/webkit2gtk-6.0's BubblewrapLauncher patch this change only moves
#   YouTube from software AV1 to software VP9. Both are needed; verify together.
GST_PLUGIN_FEATURE_RANK=dav1ddec:NONE,av1dec:NONE
