# XDG_CURRENT_DESKTOP for the phosh session.
#
# Nothing else sets it here. Upstream expects the display manager to export it
# from DesktopNames= in /usr/share/wayland-sessions/phosh.desktop
# ("Phosh;GNOME;"), but this device autologins through greetd's
# initial_session, which runs `phosh-session` directly and skips that path --
# and phosh-session itself does not export it either.
#
# With it unset, everything that asks "which desktop is this" answers "none":
#
#   - /usr/share/applications/org.gnome.Settings.desktop is OnlyShowIn=GNOME,
#     so the Settings app is hidden from the app grid entirely -- the device
#     shipped with no Settings icon at all.
#   - gnome-control-center refuses to start: "Running gnome-control-center is
#     only supported under GNOME and Unity, exiting".
#
# Both come back with this one variable. systemd --user reads environment.d,
# and phosh, gnome-session and every app launched from the grid are user
# units or children of them, so this reaches all of them.
XDG_CURRENT_DESKTOP=Phosh:GNOME
