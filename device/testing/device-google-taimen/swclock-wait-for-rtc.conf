# Drop-in for postmarketos-base's swclock-offset-boot.service.
#
# This device has no settable RTC (the pm8998 rtc@6000 node has no
# "allow-set-time", so rtc-pm8xxx returns -ENODEV from .set_time and
# systemd-timesyncd can never write the hardware clock). pmOS therefore relies
# on swclock-offset: shutdown stores system_time - rtc_since_epoch, boot
# restores system_time = rtc_since_epoch + offset. The PMIC counter keeps
# running across warm reboots, so the offset stays valid and the scheme works.
#
# Except it never runs. swclock-offset-boot.service is DefaultDependencies=no +
# Before=systemd-fsck-root.service, so it fires about a second BEFORE
# rtc-pm8xxx probes:
#
#   swclock-offset-boot[378]: rtc sys node not found, skipping
#   rtc-pm8xxx 800f000.spmi:pmic@0:rtc@6000: registered as rtc0
#
# Both swclock scripts bail out silently when /sys/class/rtc/rtc0/since_epoch
# is missing, so the clock is left at whatever systemd salvaged from
# /var/lib/systemd/timesync/clock -- days stale. Once WiFi comes up,
# systemd-timesyncd steps the clock forward by those days, which instantly
# invalidates NetworkManager's DHCP lease. Observed consequence:
#
#   dhcp4 (wlan0): state changed no lease        (on loop, wlan0 -> disconnected)
#   dnsmasq: setting upstream servers from DBus  (with an EMPTY list)
#
# i.e. WiFi and DNS both die a few minutes into every boot, and every app that
# resolves a name then blocks on timeouts -- which is most of why the device
# feels slow. See taimen/docs/HANDOFF-gnome-systemd-perf.md.
#
# Fix: wait (bounded) for the sysfs node before running the restore. Safe to
# block here -- the RTC probe is kernel-side and does not depend on userspace,
# so there is nothing to deadlock against.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -f /sys/class/rtc/rtc0/since_epoch ] && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done; [ -f /sys/class/rtc/rtc0/since_epoch ] || echo "rtc0 did not appear in 10s"'

# NOTE, deliberately NOT fixed here -- a second, unrelated defect in the same
# upstream unit. It carries:
#
#     Before=systemd-fsck-root.service systemd-fsck@.service
#
# `systemd-fsck@.service` is a *template* with no instance. systemd does not
# reject it: it instantiates the template with the referencing unit's own name,
# unescapes that into a device path, and conjures two phantom units that
# describe nothing that exists --
#
#   systemd-fsck@swclock-offset-boot.service  File System Check on /swclock/offset/boot
#   swclock-offset-boot.device                /swclock/offset/boot
#
# and that phantom is the unit named in the error returned by the query that was
# in flight when PID 1 took a SIGSEGV and froze the machine:
#
#   Failed to get timestamp properties of unit
#     systemd-fsck@swclock-offset-boot.service: Remote peer disconnected
#   systemd[1]: Caught <SEGV>, dumped core as pid 2017.
#   systemd[1]: Freezing execution.
#
# Tried and REVERTED: `Before=` (reset) + `Before=systemd-fsck-root.service` in
# this drop-in. It does not work -- systemd loads the phantom while parsing the
# main fragment, and the phantom's own implicit `After=swclock-offset-boot.service`
# re-establishes the edge, so both phantoms survive a reboot regardless. Fixing
# it properly means editing the fragment in postmarketos-base (or shipping a
# whole-unit override in /etc), which is not worth doing on an unproven theory:
# the SEGV has never been reproduced on demand, and querying the phantom while
# it is inactive is harmless.
#
# Fix it upstream in pmaports instead -- a bare template in Before= is wrong on
# every device, not just this one.
