# Tighten schedutil's reaction time (default 10 ms) so CPU frequency follows
# UI bursts within a frame.
w /sys/devices/system/cpu/cpufreq/policy0/schedutil/rate_limit_us - - - - 2000
w /sys/devices/system/cpu/cpufreq/policy4/schedutil/rate_limit_us - - - - 2000
# Keep the GPU out of runtime suspend across short interaction pauses; a
# 250 ms autosuspend means every touch after a reading pause pays the
# resume + requan cost before the first frame.
w /sys/devices/platform/soc/5000000.gpu/power/autosuspend_delay_ms - - - - 1000
