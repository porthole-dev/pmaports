# Tighten schedutil's reaction time (default 10 ms) so CPU frequency follows
# UI bursts within a frame. Globbed over policy* rather than naming policy0 and
# policy4: one line covers both clusters and it does not have to be revisited if
# the policy numbering changes. The schedutil/ directory only exists while that
# governor is selected, so this silently does nothing under any other governor
# -- that is intentional, the value is meaningless elsewhere.
w /sys/devices/system/cpu/cpufreq/policy*/schedutil/rate_limit_us - - - - 2000
# NOTE: the GPU autosuspend_delay_ms write used to live here and never once
# applied. systemd-tmpfiles-setup runs at ~16 s, the adreno driver binds at
# ~19 s, and autosuspend_delay_ms_store() returns -EIO until the driver has
# called pm_runtime_use_autosuspend(), so tmpfiles logged one I/O error per
# boot and the delay stayed at the driver default. It is now a `bind` rule in
# 90-taimen-perf.rules. Anything else added here that depends on a driver
# having probed belongs there too, for the same reason.
