# Refuse to suspend until the IPA hang is fixed.
#
# The kernel gained CONFIG_SUSPEND on 2026-07-31. Entering suspend with the
# `ipa` driver loaded hard-hangs the SoC and the hardware watchdog resets the
# phone ~30 s later -- bisected to ipa alone, see docs/HANDOFF-daily-driver.md.
#
# That matters because something already asks for it: GNOME's power plugin
# ships sleep-inactive-battery-type='suspend' with a 900 s timeout, and phosh's
# power menu has a Suspend entry. Before CONFIG_SUSPEND those calls were
# no-ops. Now they would reset an idle, unplugged phone every 15 minutes, and
# it would present as "the phone randomly reboots itself" with nothing in the
# log, because a watchdog reset does not survive into pstore.
#
# An Assert rather than a Condition on purpose: a failed assertion makes the
# suspend attempt FAIL loudly instead of silently succeeding-by-skipping, so
# whoever tries it gets told why.
#
# To re-enable once ipa suspends cleanly:  touch /run/taimen-suspend-is-safe
# and then delete this drop-in.
[Unit]
AssertPathExists=/run/taimen-suspend-is-safe
