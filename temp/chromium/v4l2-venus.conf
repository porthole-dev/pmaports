# Hardware video decode through V4L2, for SoCs whose decoder is a STATEFUL
# V4L2 M2M device -- Qualcomm venus, and the same shape on MediaTek and
# Rockchip. Ships with the build that has use_v4l2_codec=true; it does nothing,
# harmlessly, on a build that does not.
#
# Every claim below was read out of the chromium-152.0.7977.82 source, not
# inferred. File and line references are to that tree.
#
# WHY A RUNTIME FLAG IS NEEDED AT ALL. media/base/media_switches.cc:809
#
#   BASE_FEATURE(kAcceleratedVideoDecodeLinux, "AcceleratedVideoDecoder",
#   #if BUILDFLAG(USE_VAAPI)
#                base::FEATURE_ENABLED_BY_DEFAULT);
#   #else
#                base::FEATURE_DISABLED_BY_DEFAULT);
#   #endif
#
# The master switch for Linux hardware decode is enabled by default only when
# VA-API is compiled in. This build compiles VA-API OUT -- there is no VA driver
# for venus and there cannot be one, see
# brain/findings/va-api-cannot-wrap-a-stateful-v4l2-decoder -- so the feature
# defaults OFF and every video decodes in software unless it is asked for here.
#
# THE REST OF THE CHAIN IS ALREADY SATISFIED. Nothing else needs a flag:
#
#   media/base/decoder.cc:112       with USE_V4L2_CODEC and not USE_VAAPI,
#                                   ActiveLinuxVideoDecoderType() returns
#                                   kV4L2 unconditionally.
#   media/mojo/services/gpu_mojo_media_client_linux.cc:99
#                                   on a GL (not Vulkan) context, kV4L2 is
#                                   returned if kAcceleratedVideoDecodeLinuxGL
#                                   is enabled -- and media_switches.cc:817 has
#                                   it FEATURE_ENABLED_BY_DEFAULT. That matters
#                                   on an Adreno 5xx, where there is no Vulkan
#                                   driver at all.
#   media/gpu/v4l2/v4l2_device.cc:871
#                                   NO UDEV RULE IS NEEDED. The /dev/video-dec
#                                   naming that ChromeOS requires is inside
#                                   #if BUILDFLAG(IS_CHROMEOS). The mainline
#                                   branch uses the pattern "/dev/video" with
#                                   kMaxDevices = 256 (line 924) and QUERYCAPs
#                                   each node, so a venus decoder sitting at
#                                   /dev/video6 behind six camss nodes is found
#                                   on its capabilities, not its number.
CHROMIUM_ENABLE_FEATURES="${CHROMIUM_ENABLE_FEATURES:+$CHROMIUM_ENABLE_FEATURES,}AcceleratedVideoDecoder"

# --- Knob, deliberately NOT set ---------------------------------------------
# AcceleratedVideoDecodeLinuxZeroCopyGL (declared in the anonymous namespace of
# gpu_mojo_media_client_linux.cc:27, FEATURE_ENABLED_BY_DEFAULT) is what lets a
# decoded NV12 dmabuf be imported straight into GL as a native pixmap, instead
# of being run through a conversion pass first. On freedreno, which has
# EGL_EXT_image_dma_buf_import, that is the path we want, so it stays on.
#
# Advice circulating on chromium-dev says to disable it. That advice is for
# platforms whose buffers GL cannot import directly (MediaTek's tiled MM21, for
# one). It is wrong here -- but it is the FIRST thing to try if video decodes
# yet renders black, garbled or upside down:
#
#   CHROMIUM_DISABLE_FEATURES="${CHROMIUM_DISABLE_FEATURES:+$CHROMIUM_DISABLE_FEATURES,}AcceleratedVideoDecodeLinuxZeroCopyGL"

# To check it took effect, load a video and read chrome://media-internals --
# the decoder name is there, and it should say V4L2VideoDecoder. Note that the
# string "V4L2VideoDecoder" also exists in a build with no V4L2 support at all,
# because GetDecoderName() in media/base/decoder.cc names every enum value; it
# proves the decoder was SELECTED, not that it was compiled in.
# `--enable-logging=stderr --vmodule=*/media/gpu/*=2` in CHROMIUM_USER_FLAGS
# prints the V4L2 device probe.
