# elogind (the OpenRC-path logind, see postmarketos-base-ui-elogind)
# counterpart of taimen-suspend-guard.conf -- see that file's header for the
# IPA suspend hang this guards against.
#
# elogind has no separate systemd-suspend.service to Assert= on: it performs
# the sleep itself in-process. Its own shipped defaults document
# /etc/elogind/sleep.conf.d/ as the supported drop-in location for exactly
# this [Sleep] section (see /etc/elogind/sleep.conf's header).
#
# This is a STATIC block, unlike the systemd guard's AssertPathExists=
# arm/disarm gate (touch /run/taimen-suspend-is-safe): sleep.conf is read
# once at elogind startup, not re-evaluated per suspend attempt, so there is
# no config-file way to reproduce the same per-attempt arming. Given the
# failure mode on the other side of this bug (SoC hard-hang, sometimes
# needing a hands-on power cycle -- see taimen-suspend-guard.conf), the
# static block is the safer default for a path that has not been verified
# on hardware. To test-enable suspend, comment this out and restart elogind.
[Sleep]
AllowSuspend=no
