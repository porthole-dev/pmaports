# GTK4 rendering on an Adreno 540.
#
# GSK_RENDERER=ngl, which is what postmarketOS ships as its general Adreno +
# GTK4 workaround.
#
# This said `gl` until 2026-09-16, on the reasoning that "the default
# ngl/vulkan renderer path is not what this device wants". That conflated two
# separate things: the Vulkan problem is that Turnip rejects a5xx outright, and
# it is handled by VK_LOADER_DRIVERS_DISABLE below. ngl does not use Vulkan at
# all, so nothing about the a5xx Vulkan situation argued for the legacy `gl`
# renderer, and no measurement was recorded for that choice.
#
# What forced the change: under `gl`, symbolic icons in Obscura's header drew
# as solid white quads (alarm-symbolic, preferences-system-symbolic), while
# icons compiled into GTK itself (open-menu-symbolic) rendered fine. Measured
# 2026-09-16 on the same binary and session: six consecutive captures under
# `gl` were byte-identical squares; `ngl` and `cairo` both render the icons
# correctly. The icon files were all present on the device, so this was the
# renderer, NOT a missing icon theme and NOT the a5xx GMEM bin-order
# corruption fixed in mesa r51 -- that one flickered frame to frame, and r51
# is installed and mapped by both phoc and the app.
GSK_RENDERER=ngl

# VK_LOADER_DRIVERS_DISABLE: Turnip covers a6xx and newer. The A540 is a5xx and
# never will be supported -- it rejects the device outright:
#
#   TU: error: tu_device.cc:1667: device Turnip Adreno (TM) 540 is unsupported
#              (VK_ERROR_INITIALIZATION_FAILED)
#   Vulkan: Loader Message: setup_loader_term_phys_devs:
#           Failed to detect any valid GPUs in the current config
#
# Measured 2026-08-20: GSK_RENDERER=gl was already set in the session and that
# message still appeared, because the loader enumerates every installed ICD
# regardless of which GTK renderer is chosen. mesa-vulkan-freedreno is pulled in
# by soc-qcom-vulkan, so the package cannot simply be dropped for this device.
# Tell the loader to skip the driver instead, so no GTK4 app pays to load an ICD
# that is guaranteed to fail.
VK_LOADER_DRIVERS_DISABLE=*freedreno*
