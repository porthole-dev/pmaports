# The Alpine neard package ships no D-Bus activation file
# (/usr/share/dbus-1/system-services/org.neard.service) and its unit's
# [Install] section contains only Alias=, no WantedBy=. So neard can be neither
# D-Bus activated nor started at boot, and `systemctl enable neard` reports
# success while changing nothing.
#
# Starting it at boot costs nothing in RF or battery: the adapter itself comes
# up unpowered and stays that way until something toggles it.
[Install]
WantedBy=multi-user.target
