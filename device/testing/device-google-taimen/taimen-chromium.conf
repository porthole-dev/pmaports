# Chromium on a Pixel 2 XL: an Adreno 540, a 3.6 GB phone, and a panel that is
# 480 logical px wide. Alpine's chromium is a desktop build; this file is the
# part that makes it behave like it is on a phone.
#
# HOW THIS FILE COMPOSES. /usr/lib/chromium/chromium-launcher.sh sources every
# /etc/chromium/*.conf in glob order, and Alpine's chromium.conf ASSIGNS
# CHROMIUM_FLAGS outright, so this file must sort after it (c < t) and APPEND.
#
# Feature flags are NOT appended to CHROMIUM_FLAGS here. base::CommandLine keeps
# only the last occurrence of a switch, so two files each writing their own
# --enable-features silently delete one another. Contribute NAMES to the two
# lists instead; zz-features.conf, which sorts last, emits them once. Its header
# has the full explanation.

# --- Rasterise on the CPU. This one is not cosmetic. -------------------------
# Chromium's GPU process rasterises with Skia on the GPU by default, and on
# this a540 that faults the same way WebKit's Skia-GPU path does. Measured
# 2026-09-09, one boot each, same page, same arm:
#
#   default (GPU raster)          2 gpu faults, status EE0011C1, and the fault
#                                 took phoc and phosh down with it -- the
#                                 session died and wlrctl aborted with
#                                 "Assertion failed: state.display"
#   --disable-gpu-rasterization   0 gpu faults, window up in 12 s, page settled
#
# EE0011C1 is HLSQ|TPL1|SP|RB|UCHE busy with VSC/VPC idle -- the shader core
# waiting on the texture pipe and never retiring. It is the signature in
# brain/findings/the-a540-skia-gpu-faults-are-blur-shaders-stalling-the-shader-core,
# and it is why Epiphany runs with WEBKIT_SKIA_ENABLE_CPU_RENDERING=1. Same
# GPU, same fault, same answer: two browsers, one hardware bug.
#
# An a5xx recovery resets the GPU for EVERY client, not just the offender, so
# this is not "Chromium is slow without it" -- without it Chromium takes the
# whole session with it. Remove this line only when freedreno has the fix.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --disable-gpu-rasterization"

# --- Touch-sized browser UI --------------------------------------------------
# Bigger toolbar, tab and menu targets -- the metrics Chrome uses on a
# touchscreen device. Verified present in this version:
# ui/base/ui_base_switches.h:99 declares "top-chrome-touch-ui" with the values
# auto/disabled/enabled, and ui/base/pointer/touch_ui_controller.cc:183 reads
# it. The default is "auto", which on desktop Linux resolves to OFF because
# there is no tablet-mode signal to flip it -- a phone therefore has to say so.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --top-chrome-touch-ui=enabled"

# --- Give the page the scrollbar gutter back --------------------------------
# Overlay scrollbars instead of a permanent gutter. On a 480 logical px wide
# viewport that gutter is a real fraction of the page.
#
# This is precisely a desktop-vs-mobile default, not a preference:
# ui/native_theme/features/native_theme_features.cc:12 has the feature
# ENABLED_BY_DEFAULT on Android, Fuchsia and iOS, and DISABLED_BY_DEFAULT
# everywhere else. Alpine's build is "everywhere else"; this phone is not.
CHROMIUM_ENABLE_FEATURES="${CHROMIUM_ENABLE_FEATURES:+$CHROMIUM_ENABLE_FEATURES,}OverlayScrollbar"

# Fallback for the case where this device package is installed alongside a
# chromium that does NOT ship zz-features.conf -- Alpine's stock build, say.
# Without it the list above is accumulated and then nobody emits it, and the
# overlay scrollbars quietly do not happen. Which is the exact failure this
# whole arrangement exists to make impossible, so it gets a line here too.
[ -f /etc/chromium/zz-features.conf ] || \
	CHROMIUM_FLAGS="$CHROMIUM_FLAGS${CHROMIUM_ENABLE_FEATURES:+ --enable-features=$CHROMIUM_ENABLE_FEATURES}"

# --- Deliberately NOT set ---------------------------------------------------
# --force-device-scale-factor : Chromium already picks up phosh's output scale
#   and lays the page out at a sensible width; measured 2026-09-09, forcing 2.5
#   made the toolbar and text enormous and clipped the page off the right edge.
#   Leave it alone. It is here as a knob if a future panel needs it.
# --renderer-process-limit : plausible on a 3.6 GB phone, and NOT set because
#   no number has been measured yet. Pick one from an RSS measurement with
#   several tabs open, not from arithmetic. Setting it too low serialises
#   unrelated tabs behind one renderer.
