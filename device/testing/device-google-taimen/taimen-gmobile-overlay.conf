# gmobile (linked into phoc/phosh) has no compiled-in panel data for
# "google,taimen" -- upstream only ships a fixed set of devices, baked into
# libgmobile.so.0 at ITS OWN build time as a GResource bundle
# (/mobi/phosh/gmobile/devices/display-panels/<compatible>.json, confirmed
# via `strings` on the shipped 0.7.2-r0 .so: no google,taimen entry). Without
# it phosh logs "No info for 'google,taimen', please update info in gmobile"
# on every startup and renders the panel as a plain rectangle, clipping the
# rounded corners.
#
# gmobile has no runtime lookup of loose files -- the only supported
# override is GLib's own G_RESOURCE_OVERLAYS, which redirects resource reads
# under a prefix to a real directory instead of shipping a patched gmobile.
# systemd --user reads environment.d (see phosh-desktop-env.conf's header
# for why that reaches phosh), so this is the same mechanism already used
# here for GSK_RENDERER and XDG_CURRENT_DESKTOP.
#
# Panel: LG SW43402, 1440x2880 native (matches
# /sys/class/drm/card0-DSI-1/modes on device; phoc.ini ships no scale/rotate
# override for DSI-1, so phoc runs it unscaled). No notch, no punch-hole --
# corner-radii only. The radius itself is NOT sourced from this device's
# devicetree or any downstream config (none was found in ref/, blobs/,
# dtbo/, vendor-patches/) -- it is an ESTIMATE, ~7% of x-res, interpolated
# from other phones' shipped radius-to-x-res ratios in gmobile's own dataset
# (xiaomi,sweet 8.3%, fairphone,fp4/5/6 8.2-9.3%, google,zumapro-tegu
# 10.65%; Pixel 2 XL is an older, less aggressively rounded 2017 design, so
# the low end was picked). Needs visual confirmation on device.
#
# The panel file must carry BOTH radius keys. phoc reads
# gm_display_panel_get_corner_radii() (the four-element array) to mask the
# output; phosh reads gm_display_panel_get_border_radius() (the scalar) to
# round its own shell surfaces -- the top panel and the expanded quick
# settings. Verified with `strings` against phoc and libphosh on 0.56. A file
# with only corner-radii leaves phosh's surfaces square, so a press highlight
# in the drawer's bottom corner paints outside the display's rounded edge.
G_RESOURCE_OVERLAYS=/mobi/phosh/gmobile/devices/display-panels=/usr/share/taimen-gmobile-overlay/display-panels
