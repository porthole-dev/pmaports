# WebKit's session environment, for the whole user session.
#
# WHY THIS IS A PACKAGE FILE AND NOT ~/.config
#   These four lines lived in ~/.config/environment.d/50-webkit-skia-cpu.conf
#   from 2026-09-02. The 2026-09-04 rootfs reflash recreated /home and took
#   them with it, and NOTHING SAID SO -- the browser still starts, so the
#   regression comes back as four separate-looking new bugs. It was found on
#   2026-09-09 from a user report of scroll artefacts, white half-screens,
#   slow page loads and video judder, all four of which are entries in the
#   table below. A setting the device is not correct without belongs in the
#   device package; that is the lesson powerhintd already cost once.
#
#   ~/.config/environment.d still overrides this, so a measurement can still
#   drop a file there. Prefer passing the variable on the command line for a
#   one-off arm -- see below.
#
#   POSITIVE CONTROL after any change here:
#     systemctl --user daemon-reload         # re-runs the environment generators
#     systemctl --user show-environment | grep WEBKIT_
#   and for a browser that is already running:
#     tr '\0' '\n' < /proc/$(pgrep -n WebKitWebProc)/environ | grep WEBKIT_
#   A browser launched from ssh, from `systemd-run --user --scope`, or after
#   `systemctl --user set-environment` reads NONE of this -- it inherits the
#   launching shell. brain/traps/a-launch-that-skips-the-user-manager-loses-environment-d.

# --- Rasterise with Skia on the CPU, not the GPU ----------------------------
# Unset, WebKit rasterises with Skia on the GPU. On this a540 that path faults:
# Skia's blur and downsample passes stall SP/TPL1 and never retire, kernel
# hangcheck resets the GPU, and the reset is not confined to the browser --
# phoc has to rebuild its EGL renderer and re-upload every texture, so the
# corruption appears in phosh's panel and in other apps' icons.
# brain/findings/the-a540-skia-gpu-faults-are-blur-shaders-stalling-the-shader-core
# has both devcoredumps decoded, and lists what was excluded (binning, fp16).
#
# It is also, and more visibly, a memory problem. Measured 2026-09-02, same
# page, same tab:
#
#            | Skia-GPU (this unset) | CPU rasterisation
#   ---------|-----------------------|-------------------
#   web proc | 877-912 MB DRM        | 339 MB DRM
#   scope    | 1211-1311 MB, swapping| 898 MB, swap 0
#   at +87 s | systemd-oomd kills it | still running
#   icons    | filled with noise     | clean
#
# The browser's scope is capped at MemoryHigh=1500M (taimen-epiphany-memory.conf,
# read its header first -- the cap is what ARMS WebKit's own pressure handler).
# Skia-GPU therefore sits permanently against that ceiling, and WebKit answers
# memory pressure by dropping its tile cover multiplier from 2.0 to 1.0
# (CoordinatedBackingStoreProxy::createOrDestroyTiles): the backing store then
# covers the visible rect and NOTHING beyond it. Any scroll faster than the
# main thread can record new tiles shows the page's background colour where the
# content should be -- the "half the screen goes white and fills back in"
# report. So this one line is upstream of the artefacts, the stalls and the
# blank areas alike, which is exactly why its absence reads as four bugs.
WEBKIT_SKIA_ENABLE_CPU_RENDERING=1

# Size of that CPU raster pool. 2, down from WebKit's default 4, measured
# 2026-09-01 on the heavy-feed fling benchmark: 4 janks / 100 ms worst frame
# became 0-1 janks / 22-47 ms. Four raster threads oversubscribe a phone that
# is also running the WebKit main thread, the compositor and phoc on the same
# four big cores. A calibration knob, not a law -- 4 and 6 were both measured
# and both worse here.
WEBKIT_SKIA_CPU_PAINTING_THREADS=2

# --- One tile per screen width ----------------------------------------------
# 1440 = the panel's width, so a full-width layer is one tile column and not
# three partial ones. Measured 2026-09-02 against the default heuristic:
# video frame 51 -> 26 ms, drag p50 32.6 -> 23.0 ms, 4x fewer >33 ms frame
# intervals, at +44 MB of GEM. 1440x2048 is a hair better for a static video
# and worse for drags, which is the workload that matters.
WEBKIT_LAYERS_TILE_SIZE=1440x1024

# --- Do not accept a stream the panel cannot show ---------------------------
# The panel is 1440x2880. Unset, YouTube offers 2160p60 and WebKit takes it, so
# venus decodes 3840x2160 and every frame is then scaled down to at most 1440
# wide: the judder in brain/findings/youtube-judder-is-2160p60-plus-a-lockstep-decoder-not-venus-throughput
# is that stream, not a venus throughput limit (venus does 82 fps at 4K).
# Capping the advertised limit at the panel makes YouTube serve 1440p60, which
# is every pixel the display can show, at roughly half the decode bandwidth and
# the heat that goes with it.
#
# Raise it to 3840x2160@60 to test 4K decode end to end -- that is a real test
# of venus and worth running, it is just not what a 1440p panel should default
# to.
WEBKIT_GST_VIDEO_DECODING_LIMIT=2560x1440@60
