# The Voice Call sink carries no samples: a call never crosses the application
# processor, the modem exchanges speech with the ADSP and the ADSP drives the
# codec. But in this stack only an open PCM powers an AFE port, so the sink has
# to be OPEN for the duration of the call -- and nothing streams to a voice
# sink, so PipeWire would create it and leave it suspended, the downlink port
# would never start, and the call would be silent while every route and profile
# looked correct.
#
# always-process is what keeps a device node running with nothing linked to it.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.Voice_Call.*"
      }
    ]
    actions = {
      update-props = {
        node.always-process             = true
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
