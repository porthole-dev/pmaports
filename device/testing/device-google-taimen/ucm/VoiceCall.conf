# Voice call use case for the Google Pixel 2 XL (taimen).
#
# A call never passes through the application processor: the modem exchanges
# speech with the ADSP directly and the ADSP renders it into the AFE ports.
# What this verb has to do is open the route and keep it open, which is why
# the VoiceMMode1 front-end is a PCM at all -- in this stack a mixer control
# can route a path but only a PCM can power one, so opening it is what starts
# QUAT_MI2S_RX and SLIMBUS_0_TX and what makes q6voice set the session up.
#
# The ports are the ones Google's own mixer_paths_tavil_taimen.xml uses for
# "voicemmode1-call": QUAT_MI2S_RX out to the external amplifier pair, and
# SLIMBUS_0_TX in from the codec microphone.
#
# There is deliberately NO CapturePCM here. The microphone never reaches the
# application processor during a call -- the ADSP takes it straight off the
# codec -- and declaring a capture device makes PipeWire hold that PCM open
# while leaving it suspended, i.e. open but never prepared. q6voice starts the
# session only once BOTH directions have prepared (as downstream does, see
# msm-pcm-voice-v2.c), so a capture PipeWire holds and never prepares is
# exactly the half that stops the call being audible.
#
# PlaybackChannels is NOT optional decoration. alsaucm parses
# and lists this verb without them, but PipeWire's card-profile layer refuses
# it silently -- no error anywhere, the verb simply never becomes a profile,
# and callaudiod then finds no voice profile exactly as if this file did not
# exist. A voice call is mono on this board, hence 1.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' DMIC"
		cset "name='DMIC MUX7' DMIC1"

		# The vendor's gain for a call on this mic is 88 ("TX Main-mic
		# D:4 dB" in mixer_paths_tavil_taimen.xml; 84 is 0 dB, 1 dB a
		# step). Set HERE, after the verb, because HiFi declares this
		# same control as its Mic CaptureVolume and ACP reapplies it at
		# 100% -- 124, or +40 dB -- on every profile change, which rails
		# the decimator into the stop.
		cset "name='DEC7 Volume' 88"

		# Watch for the modem to report an ACTIVE call and hold the
		# uplink open for its duration -- nothing else will, because a
		# PipeWire session creates no source for this verb. It waits
		# for the call rather than opening now: the sound server
		# enables this verb once at startup just to probe the profile,
		# and a session created then has no modem session to join, so
		# it carries no audio. Stopped from HiFi's EnableSequence, not
		# from the DisableSequence above -- see the comment there.
		exec "/usr/bin/taimen-voicehold watch"
	]

	# Nothing. Pressing the loudspeaker button does NOT run a device
	# sequence and leave the verb alone -- ACP models each UCM device as its
	# own card profile, so it cycles the whole verb. Measured, by logging
	# from the sequences themselves: VERB-DISABLE, VERB-ENABLE, DEV-SPEAKER.
	# Zeroing the route here therefore stops both AFE ports underneath a
	# live ADSP vocproc that is still rendering into them, which is the
	# shape of a hard hang. The route is torn down on the way into HiFi
	# instead, which is the only transition that really ends the call.
	DisableSequence [
	]

	Value {
		TQ "Voice"

		# The ADSP renders a call at 48 kHz and the amplifier
		# configurations this board has are all "_48 KHz_", so the
		# front-end must be opened at 48 kHz -- it is what configures
		# QUAT_MI2S_RX. Without this the sound server opens the sink at
		# its own default and the call is silent while every route,
		# profile and session looks correct: PulseAudio defaults to
		# 44100, PipeWire to 48000, which is why the same image was
		# audible under one and silent under the other.
		PlaybackRate 48000
	}
}

# Earpiece and loudspeaker are the SAME AFE port on this board -- Google's
# "voicemmode1-call speaker" and "voicemmode1-call handset" paths are
# byte-identical. The difference is made inside the amplifier, by which
# firmware configuration is loaded: _s2 drives the left amp alone (earpiece),
# _s3 the right (loudspeaker). See taimen/docs/AUDIO-BUGS-2026-08-26.md.

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Speaker Configuration' 'configuration_Tuning Mode_48 KHz_s2'"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		PlaybackVolume "Speaker1 Playback Volume"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeaker"

	EnableSequence [
		cset "name='Speaker Configuration' 'configuration_Tuning Mode_48 KHz_s3'"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		PlaybackVolume "Speaker2 Playback Volume"
	}
}
