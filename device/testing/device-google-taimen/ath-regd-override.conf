# taimen's WLAN board data hardcodes regdomain 0x8348 (country 840 = US) even
# on EU units. ath_regd_init() applies that domain *before* wiphy registration,
# which freezes chan->orig_flags -- so 2.4 GHz ch 12-13 and the entire
# 5470-5725 ETSI midband (ch 100-140) are permanently disabled and cannot be
# re-enabled by any later country hint. Measured effect: an AP on ch 112 is
# completely invisible.
#
# The BDF cannot be corrected: the WLAN firmware checksum-validates it (patching
# regdomain 0x8348 -> 0x0067 made the firmware refuse to start).
#
# 0x67 = WOR02_WORLD, a permissive *world* SKU (2.4 ch 1-13 + ATH_5GHZ_ALL). It
# pins NO country -- it only ensures every channel this radio supports is
# available before registration. The actual country is then applied at runtime,
# either from the country IE in AP beacons (a world SKU gets
# REGULATORY_COUNTRY_IE_FOLLOW_POWER) or from the SIM's MCC by
# /usr/bin/taimen-wifi-country.
options ath regd_override=0x67
